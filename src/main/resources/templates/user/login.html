<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<th:block th:replace="~{includes/user/head}" />
<link rel="stylesheet" href="/frontswcenter/css/login.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<body>

<th:block th:replace="~{includes/user/header}" />

<div class="login-page">
    <main class="login-shell">
        <section class="login-intro">
            <h1 class="login-hero-title">Handong SW University</h1>
            <p class="login-hero-subtitle">교육 · 연구 · 협력 · 실무를 연결합니다</p>
        </section>

        <section class="login-card">
            <h2 class="login-card-title">Google 로그인</h2>
            <p class="login-card-desc">한동대 계정으로 로그인하세요.</p>
            <p id="login_help_message" class="login-card-desc" style="display:none; color:#b91c1c;"></p>

            <div id="g_id_onload"
                 th:attr="data-client_id=${@externalProperties.googleClientId}"
                 data-callback="handleCredentialResponse">
            </div>
            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="pill"
                 data-theme="outline"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="left">
            </div>
        </section>
    </main>
</div>

<th:block th:replace="~{includes/user/footer}" />
<th:block th:replace="~{includes/user/bottom}" />

<script>
    function handleCredentialResponse(response) {
        const idToken = response.credential;
        listenerGoogleLogin(idToken);
    }

    function listenerGoogleLogin(idToken){
        $.ajax({
            url: "/api/user/google",
            method: "POST",
            contentType : 'application/json; charset=utf-8',
            data: idToken,
            success: (data, status, xhr)=>{
                let refreshToken = xhr.getResponseHeader("RefreshToken");
                if(refreshToken === null || refreshToken === ""){
                    setLoginHelpMessage("로그인에 실패했습니다. 잠시 후 다시 시도해 주세요.");
                } else if (refreshToken.includes("not_valid_email")) {
                    setLoginHelpMessage("한동대 계정(@handong.*)으로만 로그인할 수 있습니다. 계정을 확인해 주세요.");
                    localStorage.removeItem("refreshToken");
                    localStorage.removeItem("accessToken");
                } else {
                    setLoginHelpMessage("");
                    localStorage.setItem("refreshToken", refreshToken);
                    getAccessToken();
                }
            },
            error: (data, status, xhr)=>{
                setLoginHelpMessage("로그인 처리 중 오류가 발생했습니다. 다시 시도해 주세요.");
            },
        });
    }
    function getAccessToken(){
        $.ajax({
            url: "/api/auth",
            method: "POST",
            beforeSend : function(xhr){
                let refreshToken = localStorage.getItem("refreshToken");
                xhr.setRequestHeader("RefreshToken", refreshToken);
            },
            contentType : 'application/json; charset=utf-8',
            success: (data, status, xhr)=>{
                let accessToken = xhr.getResponseHeader("Authorization");
                localStorage.setItem("accessToken", accessToken);
                redirectByAdminPermission();
            },
            error: (data, status, xhr)=>{
                setLoginHelpMessage("토큰 발급에 실패했습니다. 다시 로그인해 주세요.");
            },
        });
    }

    function redirectByAdminPermission(){
        let _data = new Map();
        _data.url = "/api/permissiondetail/allow";
        _data.type = "POST";
        _data.param = {
            target: "admin",
            func: 200
        };
        _data.success = function(obj_data){
            if(obj_data != null && obj_data.allowed === true){
                location.replace('/admin');
                return;
            }
            setLoginHelpMessage("로그인은 완료되었지만 관리자 권한이 없어 메인 페이지로 이동합니다.");
            location.replace('/index');
        };
        _data.error = function(){
            setLoginHelpMessage("권한 확인에 실패해 메인 페이지로 이동합니다.");
            location.replace('/index');
        };
        func_ajax(_data);
    }

    function setLoginHelpMessage(message){
        let target = $("#login_help_message");
        if(message == null || message === ""){
            target.hide();
            target.text("");
            return;
        }
        target.text(message);
        target.show();
    }
</script>
</body>
</html>
