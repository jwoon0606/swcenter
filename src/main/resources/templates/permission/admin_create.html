<!DOCTYPE html>
<html lang="en">

<th:block th:replace="~{includes/admin/head}" />

<body id="page-top">

<!-- Page Wrapper -->
<div id="wrapper">

    <th:block th:replace="~{includes/admin/sidebar}" />
    <script>
        $(".nav_permission_a").removeClass("collapsed");
        $(".nav_permission_div").addClass("show");
    </script>

    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">

        <!-- Main Content -->
        <div id="content">

            <th:block th:replace="~{includes/admin/topbar}" />

            <!-- Begin Page Content -->
            <div class="container-fluid">

                <!-- Page Heading -->
                <h1 class="h3 mb-2 text-gray-800">권한 생성</h1>
                <p class="mb-3">역할 템플릿으로 빠르게 생성하거나 직접 생성할 수 있습니다.</p>

                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">빠른 템플릿 생성</h6>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-outline-secondary btn-sm mr-1" onclick="create_permission_template('student'); return false;">일반학생</button>
                        <button class="btn btn-outline-primary btn-sm mr-1" onclick="create_permission_template('content'); return false;">콘텐츠관리자</button>
                        <button class="btn btn-outline-danger btn-sm" onclick="create_permission_template('super'); return false;">슈퍼관리자</button>
                    </div>
                </div>

                <div class="mb-4">
                    <div class="form-group row">

                        <label class="col-sm-2 col-form-label">*제목</label>
                        <div class="col-sm-4">
                            <input type="text" class="input_param input_required form-control mb-2" id="create_permission_title" name="title" placeholder="내용을 입력해주세요!" />
                        </div>
                        <label class="col-sm-6"></label>

                        <label class="col-sm-2 col-form-label">내용</label>
                        <div class="col-sm-10">
                            <textarea class="input_param form-control mb-2" id="create_permission_content" name="content" placeholder="내용을 입력해주세요!" ></textarea>
                        </div>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="create_permission(); return false;">직접 생성하기</button>
            </div>
            <!-- /.container-fluid -->

        </div>
        <!-- End of Main Content -->

        <th:block th:replace="~{includes/admin/footer}" />

    </div>
    <!-- End of Content Wrapper -->

</div>
<!-- End of Page Wrapper -->

<th:block th:replace="~{includes/admin/bottom}" />

<script>
    $( document ).ready(function() {
        console.log( "ready!" );
    });
    function preset_map(){
        return {
            student: {
                title: "일반학생",
                content: "공지/게시판/뉴스레터/대외활동 조회 권한",
                details: [
                    {target: "notice", func: 200},
                    {target: "board", func: 200},
                    {target: "news_letter", func: 200},
                    {target: "extracurricular_activities", func: 200}
                ]
            },
            content: {
                title: "콘텐츠관리자",
                content: "공지/게시판/지원프로젝트/뉴스레터/대외활동 생성/수정/조회 권한",
                details: [
                    {target: "notice", func: 110}, {target: "notice", func: 120}, {target: "notice", func: 200},
                    {target: "board", func: 110}, {target: "board", func: 120}, {target: "board", func: 200},
                    {target: "support_project", func: 110}, {target: "support_project", func: 120}, {target: "support_project", func: 200},
                    {target: "news_letter", func: 110}, {target: "news_letter", func: 120}, {target: "news_letter", func: 200},
                    {target: "extracurricular_activities", func: 110}, {target: "extracurricular_activities", func: 120}, {target: "extracurricular_activities", func: 200}
                ]
            },
            super: {
                title: "슈퍼관리자",
                content: "관리자 진입 + 전체 기능 권한",
                details: [
                    {target: "admin", func: 200},
                    {target: "permission", func: 110}, {target: "permission", func: 120}, {target: "permission", func: 200},
                    {target: "user", func: 110}, {target: "user", func: 120}, {target: "user", func: 200},
                    {target: "notice", func: 110}, {target: "notice", func: 120}, {target: "notice", func: 200},
                    {target: "board", func: 110}, {target: "board", func: 120}, {target: "board", func: 200}
                    , {target: "support_project", func: 110}, {target: "support_project", func: 120}, {target: "support_project", func: 200}
                    , {target: "news_letter", func: 110}, {target: "news_letter", func: 120}, {target: "news_letter", func: 200}
                    , {target: "extracurricular_activities", func: 110}, {target: "extracurricular_activities", func: 120}, {target: "extracurricular_activities", func: 200}
                ]
            }
        };
    }

    function create_permission_template(templateName){
        let preset = preset_map()[templateName];
        if(!preset){
            return;
        }
        if(!confirm("[" + preset.title + "] 권한을 생성하시겠습니까?")){
            return;
        }

        let createData = {};
        createData.url = "/api/permission";
        createData.type = "POST";
        createData.param = {title: preset.title, content: preset.content};
        createData.success = function(res){
            let permissionId = res.id;
            let remain = preset.details.length;
            let failed = false;
            if(remain === 0){
                location.href = "/permission/admin_detail/" + permissionId;
                return;
            }
            for(let each of preset.details){
                let _data = {};
                _data.url = "/api/permissiondetail/toggle";
                _data.type = "POST";
                _data.param = {
                    permissionId: permissionId,
                    target: each.target,
                    func: each.func,
                    alive: true
                };
                _data.success = function(){
                    remain -= 1;
                    if(remain === 0){
                        if(failed){
                            alert("권한 상세 일부 적용 중 오류가 발생했습니다.");
                        }
                        location.href = "/permission/admin_detail/" + permissionId;
                    }
                };
                _data.error = function(){
                    remain -= 1;
                    failed = true;
                    if(remain === 0){
                        alert("권한 상세 적용 중 오류가 발생했습니다.");
                        location.href = "/permission/admin_detail/" + permissionId;
                    }
                };
                func_ajax(_data);
            }
        };
        createData.error = function(){
            alert("권한 생성 중 오류가 발생했습니다.");
        };
        func_ajax(createData);
    }

    function create_permission(){
        let _param = listenerCreateParam();
        let _data = {};
        _data.url = "/api/permission";
        _data.type = "POST";
        _data.param = _param;
        _data.success = function(obj_data, obj_status, obj_xhr){
            alert("등록 성공");
            location.reload();
        }
        _data.error = function(obj_data, obj_status, obj_xhr){
            alert("정상적으로 이루어지지 않았습니다. 다시 시도해주세요.");
        }
        func_ajax(_data);
    }
</script>


</body>

</html>
