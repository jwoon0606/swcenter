<!DOCTYPE html>
<html lang="en">

<th:block th:replace="~{includes/admin/head}" />

<body id="page-top">

<div id="wrapper">

    <th:block th:replace="~{includes/admin/sidebar}" />
    <script>
        $(".nav_support_project_a").removeClass("collapsed");
        $(".nav_support_project_div").addClass("show");
    </script>

    <div id="content-wrapper" class="d-flex flex-column">

        <div id="content">

            <th:block th:replace="~{includes/admin/topbar}" />

            <div class="container-fluid">

                <h1 class="h3 mb-2 text-gray-800">지원 프로젝트 : <span class="font_support_project_title">-</span> </h1>
                <p class="mb-4">지원 프로젝트 상세입니다.</p>

                <div class="mb-4">
                    <div class="form-group row">
                        <input type="hidden" id="detail_support_project_id" />

                        <label class="col-sm-2 col-form-label">*삭제여부</label>
                        <div class="col-sm-4">
                            <select class="input_param input_required form-control mb-2" id="detail_support_project_deleted" name="deleted" onchange="update_support_project(this)">
                                <option value="" selected="selected">전체</option>
                                <option value="false">일반</option>
                                <option value="true">삭제</option>
                            </select>
                        </div>
                        <label class="col-sm-6"></label>

                        <label class="col-sm-2 col-form-label">*제목</label>
                        <div class="col-sm-4">
                            <input type="text" class="input_param input_required form-control mb-2" id="detail_support_project_title" name="title" placeholder="제목을 입력해주세요!" onchange="update_support_project(this)" />
                        </div>
                        <label class="col-sm-2 col-form-label">URL</label>
                        <div class="col-sm-4">
                            <input type="text" class="input_param form-control mb-2" id="detail_support_project_url" name="url" placeholder="URL을 입력해주세요!" onchange="update_support_project(this)" />
                        </div>

                        <label class="col-sm-2 col-form-label">게시일</label>
                        <div class="col-sm-4">
                            <input type="date" class="input_param form-control mb-2" id="detail_support_project_publishedDate" name="publishedDate" onchange="update_support_project(this)" />
                        </div>
                        <label class="col-sm-6"></label>

                        <label class="col-sm-2 col-form-label">내용</label>
                        <div class="col-sm-10">
                            <textarea class="input_param form-control mb-2" id="detail_support_project_content" name="content" placeholder="내용을 입력해주세요!" onchange="update_support_project(this)" ></textarea>
                        </div>

                        <label class="col-sm-2 col-form-label">메인 사진</label>
                        <div class="col-sm-10">
                            <input type="text" class="input_param form-control mb-2" id="detail_support_project_img" name="img" placeholder="이미지 URL을 입력해주세요!" onchange="update_support_project(this)" />
                            <input type="file" class="form-control mb-2" id="support_project_img" accept="image/*" placeholder="내용을 입력해주세요!" onchange="listenerSetImage(this, listener_upload_support_project_img)"/>
                            <img class="hide" id="img_support_project_img" style="height: 75px;" alt="메인 사진" />
                        </div>

                    </div>

                </div>
            </div>

        </div>

        <th:block th:replace="~{includes/admin/footer}" />

    </div>

</div>

<th:block th:replace="~{includes/admin/bottom}" />

<script>
    $(document).ready(function () {
        detail_support_project();
    });

    function listener_upload_support_project_img() {
        let tempFile = null;
        let inputFile = document.getElementById('support_project_img');
        if (inputFile.files.length > 0) {
            tempFile = inputFile.files[0];
        }
        let fileData = new FormData();
        fileData.append("file", tempFile);
        $.ajax({
            url: "/api/default/uploadFile",
            type: "POST",
            data: fileData,
            cache: false,
            contentType: false,
            processData: false,
            success: (data)=>{
                $("#detail_support_project_img").val("/image/" + data);
                update_support_project("#detail_support_project_img");
            },
            error: ()=>{
                alert("error");
            },
        });
    }

    function update_support_project(obj_this){
        let _param = {
            id : getIdFromUrl(null)
        };
        let paramName = $(obj_this).attr("name");
        let paramValue = $(obj_this).val();
        if (paramName === "publishedDate" && !paramValue) {
            paramValue = null;
        }
        _param[paramName] = paramValue;
        let _data = {};
        _data.url = "/api/support_project";
        _data.type = "PUT";
        _data.param = _param;
        _data.success = function(){};
        _data.error = function(){
            alert("정상적으로 이루어지지 않았습니다. 다시 시도해주세요.");
        }
        func_ajax(_data);
    }

    function detail_support_project() {
        let supportProjectId = getIdFromUrl(null);
        let _data = new Map();
        _data.url = "/api/support_project";
        _data.type = "GET";
        _data.param = {'id': supportProjectId};
        _data.success = function (obj_data) {
            listenerAfterDetail(obj_data, "support_project");
        }
        _data.error = function () {
            alert("정상적으로 이루어지지 않았습니다. 다시 시도해주세요.");
        }
        func_ajax(_data);
    }
</script>

</body>

</html>
