<!DOCTYPE html>
<html lang="en">

<th:block th:replace="~{includes/admin/head}" />

<body id="page-top">

<!-- Page Wrapper -->
<div id="wrapper">

    <th:block th:replace="~{includes/admin/sidebar}" />

    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">

        <!-- Main Content -->
        <div id="content">

            <th:block th:replace="~{includes/admin/topbar}" />

            <div class="container-fluid">
                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">관리자 안내</h6>
                    </div>
                    <div class="card-body" id="admin_permission_guide">
                        권한 정보를 확인 중입니다...
                    </div>
                </div>
            </div>

        </div>
        <!-- End of Main Content -->

        <th:block th:replace="~{includes/admin/footer}" />

    </div>
    <!-- End of Content Wrapper -->

</div>
<!-- End of Page Wrapper -->

<th:block th:replace="~{includes/admin/bottom}" />

<script>
    $( document ).ready(function() {
        render_admin_permission_guide({
            state: window.adminPermissionState || "loading",
            targets: window.adminPermissionTargets || []
        });
    });

    window.addEventListener("admin-permission-state", function(event){
        render_admin_permission_guide(event.detail || { state: "loading", targets: [] });
    });

    function render_admin_permission_guide(detail){
        let state = detail.state || "loading";
        let targets = detail.targets || [];
        let guide = $("#admin_permission_guide");

        if(state === "loading"){
            guide.html("권한 정보를 확인 중입니다...");
            return;
        }

        if(state === "error"){
            guide.html(
                "<p class='mb-2'>권한 정보를 불러오지 못했습니다.</p>" +
                "<p class='mb-0 text-muted'>잠시 후 새로고침하거나 다시 로그인해 주세요.</p>"
            );
            return;
        }

        if(state === "none"){
            guide.html(
                "<p class='mb-2'>현재 계정에는 관리자 메뉴 권한이 없습니다.</p>" +
                "<p class='mb-0 text-muted'>권한이 필요하면 관리자에게 권한 부여를 요청해 주세요.</p>"
            );
            return;
        }

        let routeMap = {
            permission: { label: "권한", url: "/permission/admin_list" },
            user: { label: "사용자", url: "/user/admin_list" },
            notice: { label: "공지사항", url: "/notice/admin_list" },
            news_letter: { label: "뉴스레터", url: "/news/admin_news_letter" },
            extracurricular_activities: { label: "대외활동", url: "/news/admin_extracurricular_activities" },
            board: { label: "일반게시판", url: "/board/admin_list" },
            support_project: { label: "지원 프로젝트", url: "/support_project/admin_list" },
            faq: { label: "FAQ", url: "/faq/admin_list" },
            popup: { label: "팝업", url: "/popup/admin_list" }
        };

        let chips = [];
        let uniqueTargets = [...new Set(targets)];
        for(let t of uniqueTargets){
            if(routeMap[t]){
                chips.push("<a class='badge badge-primary mr-1 mb-1' href='" + routeMap[t].url + "'>" + routeMap[t].label + "</a>");
            }
        }

        if(chips.length === 0){
            guide.html(
                "<p class='mb-2'>권한은 확인되었지만 연결된 관리자 메뉴가 없습니다.</p>" +
                "<p class='mb-0 text-muted'>권한 상세에서 타깃 설정을 확인해 주세요.</p>"
            );
            return;
        }

        guide.html(
            "<p class='mb-2'>접근 가능한 관리자 메뉴입니다.</p>" +
            "<div>" + chips.join("") + "</div>"
        );
    }
</script>

</body>

</html>
