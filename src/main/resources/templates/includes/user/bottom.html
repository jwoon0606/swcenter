<script>
    function toggleMenu() {
        const nav = document.querySelector('.header__nav');
        nav.classList.toggle('active');
    }

    function format_display_datetime(value) {
        if (value == null) {
            return "-";
        }

        const raw = String(value).trim();
        if (raw === "") {
            return "-";
        }

        const normalized = raw.replace("T", " ");
        const match = normalized.match(/^(\d{4}-\d{2}-\d{2})\s+(\d{2}:\d{2})/);
        if (match) {
            return match[1] + " " + match[2];
        }

        const parsed = new Date(raw);
        if (!Number.isNaN(parsed.getTime())) {
            const year = parsed.getFullYear();
            const month = String(parsed.getMonth() + 1).padStart(2, "0");
            const day = String(parsed.getDate()).padStart(2, "0");
            const hours = String(parsed.getHours()).padStart(2, "0");
            const minutes = String(parsed.getMinutes()).padStart(2, "0");
            return year + "-" + month + "-" + day + " " + hours + ":" + minutes;
        }

        return normalized;
    }

    function logout_user() {
        localStorage.removeItem("refreshToken");
        localStorage.removeItem("accessToken");
        location.href = "/index";
    }

    $(function(){
        if (listener_is_login()) {
            $("#topbar_login_link").hide();
            $("#topbar_logout_link").show();
            load_admin_link_visibility();
        } else {
            $("#topbar_login_link").show();
            $("#topbar_logout_link").hide();
            $("#topbar_admin_link").hide();
        }
    });

    function load_admin_link_visibility(){
        $("#topbar_admin_link").hide();
        request_admin_link_visibility(false);
    }

    function request_admin_link_visibility(retriedAfterRefresh){
        $.ajax({
            url: "/api/permissiondetail/allow",
            type: "POST",
            headers: {
                "Authorization": localStorage.getItem("accessToken")
            },
            contentType: "application/json; charset=utf-8",
            data: JSON.stringify({
                target: "admin",
                func: 200
            }),
            success: function(obj_data){
                if(obj_data != null && obj_data.allowed === true){
                    $("#topbar_admin_link").show();
                } else {
                    $("#topbar_admin_link").hide();
                }
            },
            error: function(xhr){
                if (!retriedAfterRefresh && xhr != null && xhr.status === 401) {
                    refresh_access_token_for_admin_link(function(success){
                        if (success) {
                            request_admin_link_visibility(true);
                        } else {
                            $("#topbar_admin_link").hide();
                        }
                    });
                    return;
                }
                $("#topbar_admin_link").hide();
            }
        });
    }

    function refresh_access_token_for_admin_link(callback){
        let refreshToken = localStorage.getItem("refreshToken");
        if (refreshToken == null || String(refreshToken).trim() === "") {
            callback(false);
            return;
        }
        $.ajax({
            url: "/api/auth",
            method: "POST",
            beforeSend: function(xhr){
                xhr.setRequestHeader("RefreshToken", refreshToken);
            },
            success: function(data, status, xhr){
                let accessToken = xhr.getResponseHeader("Authorization");
                if (accessToken == null || String(accessToken).trim() === "") {
                    callback(false);
                    return;
                }
                localStorage.setItem("accessToken", accessToken);
                callback(true);
            },
            error: function(){
                callback(false);
            }
        });
    }
</script>
