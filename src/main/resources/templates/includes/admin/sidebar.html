<script>
    $( document ).ready(function() {
        search_permissiondetail();
    });
    function notify_admin_permission_state(state, targets) {
        window.adminPermissionState = state;
        window.adminPermissionTargets = targets || [];
        window.dispatchEvent(new CustomEvent("admin-permission-state", {
            detail: { state: state, targets: window.adminPermissionTargets }
        }));
    }
    function search_permissiondetail() {
        let _data = new Map();
        _data.url = "/api/permissiondetail/access";
        _data.type = "GET";
        _data.param = {};
        notify_admin_permission_state("loading", []);
        _data.success = function(obj_data, obj_status, obj_xhr){
            let tempList = obj_data || [];
            let targets = [];
            for(let each of tempList){
                let tempTarget = each["target"];
                targets.push(tempTarget);
                $(".nav_div_" + tempTarget).css("display", "");
            }
            if(tempList.length === 0){
                notify_admin_permission_state("none", []);
            } else {
                notify_admin_permission_state("ok", targets);
            }
        }
        _data.error = function(obj_data, obj_status, obj_xhr){
            notify_admin_permission_state("error", []);
        }
        func_ajax(_data);
    }
</script>
