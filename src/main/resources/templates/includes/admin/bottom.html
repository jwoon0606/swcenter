<script>
    function format_display_datetime(value) {
        if (value == null) {
            return "-";
        }

        let raw = String(value).trim();
        if (raw === "") {
            return "-";
        }

        let normalized = raw.replace("T", " ");
        let match = normalized.match(/^(\d{4}-\d{2}-\d{2})\s+(\d{2}:\d{2})/);
        if (match) {
            return match[1] + " " + match[2];
        }

        let parsed = new Date(raw);
        if (!Number.isNaN(parsed.getTime())) {
            let year = parsed.getFullYear();
            let month = String(parsed.getMonth() + 1).padStart(2, "0");
            let day = String(parsed.getDate()).padStart(2, "0");
            let hours = String(parsed.getHours()).padStart(2, "0");
            let minutes = String(parsed.getMinutes()).padStart(2, "0");
            return year + "-" + month + "-" + day + " " + hours + ":" + minutes;
        }

        return normalized;
    }

    if (typeof Handlebars !== "undefined" && typeof Handlebars.registerHelper === "function") {
        Handlebars.registerHelper("formatDateTime", function (value) {
            return format_display_datetime(value);
        });
    }
</script>
