<!DOCTYPE html>
<html lang="ko">
<th:block th:replace="~{includes/user/head}" />
<link rel="stylesheet" href="/frontswcenter/css/aside.css">
<body>

<th:block th:replace="~{includes/user/header}" />

<div class="page-layout">
    <th:block th:replace="~{includes/user/aside}" />
    <script> listener_aside_nav_active("news", 1); </script>

    <main class="content-area detail-page">
        <h1 class="page-title"><a href="/notice/list" style="color: inherit; text-decoration: none;">공지사항</a></h1>

        <div class="content-box detail-card">
            <div class="detail-title font_notice_title">-</div>
            <div class="detail-meta">
                <span class="font_notice_createdAt">-</span>
                <span class="detail-divider"></span>
                <span>조회수 <span id="notice_view_count">0</span></span>
                <span class="detail-divider"></span>
                <span>좋아요 <span id="notice_like_count">0</span></span>
                <div class="detail-actions">
                    <button class="ghost-button" id="notice_like_btn" onclick="toggle_notice_like(); return false;">좋아요</button>
                    <button class="ghost-button" id="notice_edit_btn" style="display:none;" onclick="location.href='/notice/edit/' + currentNoticeId; return false;">글 수정</button>
                    <button class="ghost-button" id="notice_delete_btn" style="display:none;" onclick="delete_notice(); return false;">글 삭제</button>
                </div>
            </div>
            <div id="notice_image_wrap" style="display:none; margin: 16px 0;">
                <img id="notice_image" src="" alt="공지 대표 이미지" style="max-width:100%; border-radius:12px;">
            </div>
            <div class="detail-body font_notice_content">-</div>

            <div class="comment-box">
                <div class="comment-header">
                    <h3>댓글</h3>
                </div>
                <div id="notice_comment_list"></div>
                <div class="comment-input-row">
                    <textarea class="input_param" id="notice_comment_input" name="comment" placeholder="댓글을 입력해주세요."></textarea>
                    <button class="primary-button" onclick="add_notice_comment(); return false;">댓글 등록</button>
                </div>
            </div>
            <div class="detail-footer">
                <button class="secondary-button" onclick="location.href='/notice/list'; return false;">목록으로</button>
            </div>
        </div>

    </main>

</div>

<th:block th:replace="~{includes/user/footer}" />
<th:block th:replace="~{includes/user/bottom}" />

<script>
    let currentNoticeId = null;
    let currentNoticeData = null;
    let editingCommentId = null;
    let editingCommentText = "";
    const noticeLikeStoragePrefix = "notice_like_";

    function render_notice_extras(data) {
        let viewCount = parseInt(data.viewCount, 10);
        let likeCount = parseInt(data.likeCount, 10);
        $("#notice_view_count").text(Number.isFinite(viewCount) ? viewCount : 0);
        $("#notice_like_count").text(Number.isFinite(likeCount) ? likeCount : 0);
        render_notice_image(currentNoticeData || data);
        let liked = get_notice_like_state();
        $("#notice_like_btn").text(liked ? "좋아요 취소" : "좋아요");
        if (data && data.canUpdate === true) {
            $("#notice_edit_btn").show();
            $("#notice_delete_btn").show();
        } else {
            $("#notice_edit_btn").hide();
            $("#notice_delete_btn").hide();
        }
    }
    function render_notice_image(data) {
        let img = (data && data.img) ? (data.img + "").trim() : "";
        if (!img) {
            $("#notice_image_wrap").hide();
            $("#notice_image").attr("src", "");
            return;
        }
        $("#notice_image").attr("src", img);
        $("#notice_image_wrap").show();
    }
    function toggle_notice_like() {
        if (!currentNoticeId) { return; }
        let liked = !get_notice_like_state();
        let _data = new Map();
        _data.url = "/api/notice/like";
        _data.type = "POST";
        _data.param = {
            id: currentNoticeId,
            liked: liked
        };
        _data.success = function (obj_data) {
            set_notice_like_state(liked);
            if (currentNoticeData == null) {
                currentNoticeData = {};
            }
            currentNoticeData.viewCount = obj_data.viewCount;
            currentNoticeData.likeCount = obj_data.likeCount;
            render_notice_extras(currentNoticeData);
        };
        _data.error = function () {
            alert("좋아요 처리 중 오류가 발생했습니다.");
        };
        func_ajax(_data);
    }
    function render_notice_comments(id) {
        let $list = $("#notice_comment_list");
        let _data = new Map();
        _data.url = "/api/notice/comment/list";
        _data.type = "GET";
        _data.param = { id: id };
        _data.success = function(list){
            $list.html("");
            if (list == null || list.length === 0) {
                $list.append("<div class=\"comment-empty\">등록된 댓글이 없습니다.</div>");
                return;
            }
            for (let item of list) {
                let $item = $("<div class=\"comment-item\"></div>");
                if (editingCommentId === item.id) {
                    let $editorWrap = $("<div class=\"comment-edit-wrap\" style=\"margin-bottom:8px;\"></div>");
                    $("<textarea class=\"input_param\" rows=\"3\" style=\"width:100%;\"></textarea>")
                        .attr("id", "notice_comment_edit_input_" + item.id)
                        .val(editingCommentText)
                        .appendTo($editorWrap);
                    $item.append($editorWrap);
                } else {
                    $("<div class=\"comment-text\" data-comment-id=\"" + item.id + "\"></div>").text(item.content || "").appendTo($item);
                }
                let metaText = ((item.userNick || item.userEmail || "익명") + " · " + (item.createdAt || ""));
                $("<div class=\"comment-meta\"></div>").text(metaText).appendTo($item);
                if (item.editable === true || item.deletable === true) {
                    let $actions = $("<div class=\"comment-actions\" style=\"margin-top:8px;\"></div>");
                    if (item.editable === true) {
                        if (editingCommentId === item.id) {
                            $("<button class=\"ghost-button\" style=\"margin-right:8px;\">저장</button>")
                                .on("click", function(){ save_comment_edit(item.id); })
                                .appendTo($actions);
                            $("<button class=\"ghost-button\" style=\"margin-right:8px;\">취소</button>")
                                .on("click", function(){ cancel_comment_edit(); })
                                .appendTo($actions);
                        } else {
                            $("<button class=\"ghost-button\" style=\"margin-right:8px;\">수정</button>")
                                .on("click", function(){ begin_comment_edit(item.id, item.content || ""); })
                                .appendTo($actions);
                        }
                    }
                    if (item.deletable === true) {
                        $("<button class=\"ghost-button\">삭제</button>")
                            .on("click", function(){ delete_notice_comment(item.id); })
                            .appendTo($actions);
                    }
                    $item.append($actions);
                }
                $list.append($item);
            }
        };
        _data.error = function(){
            $list.html("<div class=\"comment-empty\">댓글을 불러오지 못했습니다.</div>");
        };
        func_ajax(_data);
    }
    function add_notice_comment() {
        if (!currentNoticeId) { return; }
        if (!listener_is_login()) {
            alert("로그인 후 댓글을 작성할 수 있습니다.");
            return;
        }
        let text = $("#notice_comment_input").val().trim();
        if (!text) {
            alert("댓글 내용을 입력해주세요.");
            return;
        }
        let _data = new Map();
        _data.url = "/api/notice/comment";
        _data.type = "POST";
        _data.param = {
            noticeId: currentNoticeId,
            content: text
        };
        _data.success = function(){
            $("#notice_comment_input").val("");
            render_notice_comments(currentNoticeId);
        };
        _data.error = function(){
            alert("댓글 등록 중 오류가 발생했습니다.");
        };
        func_ajax(_data);
    }
    function begin_comment_edit(commentId, content) {
        editingCommentId = commentId;
        editingCommentText = content || "";
        render_notice_comments(currentNoticeId);
    }
    function cancel_comment_edit() {
        editingCommentId = null;
        editingCommentText = "";
        render_notice_comments(currentNoticeId);
    }
    function save_comment_edit(commentId) {
        let inputId = "#notice_comment_edit_input_" + commentId;
        let nextText = ($(inputId).val() || "").trim();
        if (!nextText) {
            alert("댓글 내용을 입력해주세요.");
            return;
        }
        let _data = new Map();
        _data.url = "/api/notice/comment";
        _data.type = "PUT";
        _data.param = {
            id: commentId,
            content: nextText
        };
        _data.success = function(){
            editingCommentId = null;
            editingCommentText = "";
            render_notice_comments(currentNoticeId);
        };
        _data.error = function(){
            alert("댓글 수정 중 오류가 발생했습니다.");
        };
        func_ajax(_data);
    }
    function delete_notice_comment(commentId) {
        if (!confirm("댓글을 삭제하시겠습니까?")) {
            return;
        }
        if (editingCommentId === commentId) {
            editingCommentId = null;
            editingCommentText = "";
        }
        let _data = new Map();
        _data.url = "/api/notice/comment";
        _data.type = "DELETE";
        _data.param = {
            id: commentId
        };
        _data.success = function(){
            render_notice_comments(currentNoticeId);
        };
        _data.error = function(){
            alert("댓글 삭제 중 오류가 발생했습니다.");
        };
        func_ajax(_data);
    }
    function delete_notice() {
        if (!currentNoticeId) { return; }
        if (!confirm("이 공지글을 삭제하시겠습니까?")) {
            return;
        }
        let _data = new Map();
        _data.url = "/api/notice";
        _data.type = "DELETE";
        _data.param = {
            id: currentNoticeId
        };
        _data.success = function(){
            alert("삭제되었습니다.");
            location.href = "/notice/list";
        };
        _data.error = function(){
            alert("글 삭제 중 오류가 발생했습니다.");
        };
        func_ajax(_data);
    }

    $(function(){
        console.log( "ready!" );
        detail_notice();
    });
    function detail_notice() {
        let noticeId = getIdFromUrl(null);
        currentNoticeId = noticeId;

        let _viewData = new Map();
        _viewData.url = "/api/notice/view";
        _viewData.type = "POST";
        _viewData.param = {'id': noticeId};
        _viewData.success = function () {
            load_notice_detail(noticeId);
        };
        _viewData.error = function () {
            load_notice_detail(noticeId);
        };
        func_ajax(_viewData);
    }

    function load_notice_detail(noticeId){
        let _data = new Map();
        _data.url = "/api/notice";
        _data.type = "GET";
        _data.param = {'id': noticeId};
        _data.success = function (obj_data, obj_status, obj_xhr) {
            currentNoticeData = obj_data || {};
            listenerAfterDetail(obj_data, "notice");
            render_notice_extras(currentNoticeData);
            render_notice_comments(noticeId);
        }
        _data.error = function (obj_data, obj_status, obj_xhr) {
            alert("정상적으로 이루어지지 않았습니다. 다시 시도해주세요.");
        }
        func_ajax(_data);
    }

    function get_notice_like_state(){
        if(!currentNoticeId){
            return false;
        }
        return localStorage.getItem(noticeLikeStoragePrefix + currentNoticeId) === "1";
    }
    function set_notice_like_state(liked){
        if(!currentNoticeId){
            return;
        }
        if(liked){
            localStorage.setItem(noticeLikeStoragePrefix + currentNoticeId, "1");
        } else {
            localStorage.removeItem(noticeLikeStoragePrefix + currentNoticeId);
        }
    }
</script>
</body>

</html>
