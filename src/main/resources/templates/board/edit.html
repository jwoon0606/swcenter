<!DOCTYPE html>
<html lang="ko">
<th:block th:replace="~{includes/user/head}" />
<link rel="stylesheet" href="https://news.aiswcenter.org/publish/css/aside.css">
<body>

<th:block th:replace="~{includes/user/header}" />

<div class="page-layout">
    <th:block th:replace="~{includes/user/aside}" />
    <script> listener_aside_nav_active("board", 1); </script>

    <main class="content-area">
        <h1 class="page-title">일반게시판 수정</h1>

        <div class="content-box">
            <div class="form-grid">
                <input type="hidden" id="edit_board_id" />
                <div class="form-field">
                    <label for="edit_board_title">제목</label>
                    <input type="text" class="input_param input_required" id="edit_board_title" name="title" placeholder="제목을 입력해주세요." />
                </div>
                <div class="form-field">
                    <label for="edit_board_content">내용</label>
                    <textarea class="input_param" id="edit_board_content" name="content" placeholder="내용을 입력해주세요."></textarea>
                </div>
                <div class="form-field">
                    <label for="edit_board_img_url">메인 이미지 URL</label>
                    <input type="text" class="input_param" id="edit_board_img_url" name="img" placeholder="/image/..." />
                </div>
                <div class="form-field">
                    <label for="edit_board_img_file">메인 이미지 파일</label>
                    <input type="file" id="edit_board_img_file" accept="image/*" onchange="upload_board_image();" />
                    <img class="hide" id="img_edit_board_img_file" style="height: 75px;" alt="메인 사진" />
                </div>
                <div class="content-actions">
                    <button class="secondary-button" onclick="location.href='/board/detail/' + getIdFromUrl(null); return false;">취소</button>
                    <button class="primary-button" onclick="update_board(); return false;">수정 저장</button>
                </div>
            </div>
        </div>
    </main>
</div>

<th:block th:replace="~{includes/user/footer}" />
<th:block th:replace="~{includes/user/bottom}" />

<script>
    $(function(){
        if (!listener_is_login()) {
            alert("로그인이 필요합니다.");
            location.replace("/user/login");
            return;
        }
        load_board();
    });

    function load_board(){
        let boardId = getIdFromUrl(null);
        let _data = new Map();
        _data.url = "/api/board";
        _data.type = "GET";
        _data.param = {id: boardId};
        _data.success = function(obj_data){
            if (!obj_data || obj_data.canUpdate !== true) {
                alert("게시글 수정 권한이 없습니다.");
                location.replace("/board/detail/" + boardId);
                return;
            }
            $("#edit_board_id").val(obj_data.id || boardId);
            $("#edit_board_title").val(obj_data.title || "");
            $("#edit_board_content").val(obj_data.content || "");
            $("#edit_board_img_url").val(obj_data.img || "");
            if (obj_data.img) {
                $("#img_edit_board_img_file").attr("src", obj_data.img).removeClass("hide");
            }
        };
        _data.error = function(){
            alert("게시글 정보를 불러오지 못했습니다.");
            location.replace("/board/list");
        };
        func_ajax(_data);
    }

    function upload_board_image() {
        let tempFile = null;
        let inputFile = document.getElementById("edit_board_img_file");
        if (inputFile.files.length > 0) {
            tempFile = inputFile.files[0];
        }
        if (tempFile == null) {
            return;
        }
        let fileData = new FormData();
        fileData.append("file", tempFile);
        $.ajax({
            url: "/api/default/uploadFile",
            type: "POST",
            data: fileData,
            cache: false,
            contentType: false,
            processData: false,
            success: function(data){
                let imgPath = "/image/" + data;
                $("#edit_board_img_url").val(imgPath);
                $("#img_edit_board_img_file").attr("src", imgPath).removeClass("hide");
            },
            error: function(){
                alert("이미지 업로드 중 오류가 발생했습니다.");
            }
        });
    }

    function update_board(){
        let title = ($("#edit_board_title").val() || "").trim();
        if (!title) {
            alert("제목을 입력해주세요.");
            return;
        }
        let boardId = Number($("#edit_board_id").val() || getIdFromUrl(null));
        let _data = new Map();
        _data.url = "/api/board";
        _data.type = "PUT";
        _data.param = {
            id: boardId,
            title: title,
            content: $("#edit_board_content").val(),
            img: ($("#edit_board_img_url").val() || "").trim()
        };
        _data.success = function(){
            alert("수정되었습니다.");
            location.href = "/board/detail/" + boardId;
        };
        _data.error = function(){
            alert("수정 중 오류가 발생했습니다.");
        };
        func_ajax(_data);
    }
</script>
</body>
</html>
