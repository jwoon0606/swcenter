<!DOCTYPE html>
<html lang="en">

<th:block th:replace="~{includes/admin/head}" />

<body id="page-top">

<div id="wrapper">

    <th:block th:replace="~{includes/admin/sidebar}" />
    <script>
        $(".nav_news_letter_a").removeClass("collapsed");
        $(".nav_news_letter_div").addClass("show");
    </script>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <th:block th:replace="~{includes/admin/topbar}" />

            <div class="container-fluid">
                <h1 class="h3 mb-2 text-gray-800">뉴스레터 관리</h1>
                <p class="mb-4">뉴스레터 목록 조회, 등록, 수정, 삭제, 발송을 관리합니다.</p>

                <div class="mb-4">
                    <input type="hidden" id="input_newsletter_keyword_changed" value="0" />
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">삭제여부</label>
                        <div class="col-sm-4">
                            <select class="select_search_newsletter_keyword form-control mb-2" name="deleted" id="search_newsletter_deleted" onchange="listener_newsletter_keyword_changed()">
                                <option value="" selected="selected">전체</option>
                                <option value="false">일반</option>
                                <option value="true">삭제</option>
                            </select>
                        </div>
                        <label class="col-sm-6 col-form-label"></label>

                        <label class="col-sm-2 col-form-label">등록 시기</label>
                        <div class="col-sm-3">
                            <input class="form-control mb-2" id="search_newsletter_sdate" type="date" onchange="listener_newsletter_keyword_changed()"/>
                        </div>
                        <div class="col-sm-3">
                            <input class="form-control mb-2" id="search_newsletter_fdate" type="date" onchange="listener_newsletter_keyword_changed()"/>
                        </div>
                        <div class="col-sm-4">
                            <button class="btn btn-sm btn-outline-secondary" onclick="set_search_sdatefdate('null', 'newsletter', listener_newsletter_keyword_changed); return false;">초기화</button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="set_search_sdatefdate('today', 'newsletter', listener_newsletter_keyword_changed); return false;">오늘</button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="set_search_sdatefdate('week', 'newsletter', listener_newsletter_keyword_changed); return false;">1주</button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="set_search_sdatefdate('month', 'newsletter', listener_newsletter_keyword_changed); return false;">1개월</button>
                        </div>

                        <label class="col-sm-2 col-form-label">키워드</label>
                        <div class="col-sm-2">
                            <select class="form-control mb-2" id="search_newsletter_keyword_field" onchange="set_newsletter_keyword_field()">
                                <option value="10" selected="selected">제목/요약</option>
                                <option value="20">카테고리</option>
                            </select>
                        </div>
                        <div class="col-sm-8">
                            <input id="search_newsletter_keyword" onchange="listener_newsletter_keyword_changed();"
                                   class="form-control search_newsletter_keyword_each search_newsletter_keyword_each_10 mb-2" type="text" placeholder="제목 또는 요약을 입력하세요"/>
                            <input id="search_newsletter_category" onchange="listener_newsletter_keyword_changed();"
                                   class="form-control search_newsletter_keyword_each search_newsletter_keyword_each_20 mb-2 hide" type="text" placeholder="카테고리를 입력하세요 (예: company, interview)"/>
                        </div>

                        <input type="hidden" id="cursor_newsletter" />
                        <label class="col-sm-2 col-form-label">검색 기준</label>
                        <div class="col-sm-2">
                            <select class="form-control" id="search_newsletter_orderby" onchange="listener_newsletter_keyword_changed();">
                                <option value="id" selected="selected">등록순</option>
                            </select>
                        </div>
                        <label class="col-sm-2 col-form-label">한번에 불러올 갯수</label>
                        <div class="col-sm-2">
                            <select id="search_newsletter_perpage" class="form-control" onchange="listener_newsletter_keyword_changed();">
                                <option value="10">10</option>
                                <option value="50" selected="selected">50</option>
                                <option value="100">100</option>
                            </select>
                        </div>
                        <label class="col-sm-2 col-form-label">조회방향</label>
                        <div class="col-sm-2">
                            <select id="search_newsletter_orderway" class="form-control" onchange="listener_newsletter_keyword_changed();">
                                <option value="DESC" selected="selected">역방향</option>
                                <option value="ASC">정방향</option>
                            </select>
                        </div>

                        <label class="col-sm-10 col-form-label"></label>
                        <div class="col-sm-2 text-right">
                            <button class="btn btn-sm btn-outline-secondary" onclick="reset_newsletter_search(); return false;">초기화</button>
                        </div>
                    </div>
                </div>

                <div class="w-100 mb-2">
                    <button id="btn_newsletter_create" class="btn btn-primary" onclick="open_create_newsletter_modal(); return false;">뉴스레터 등록</button>
                    <span id="newsletter_readonly_msg" class="text-muted ml-2" style="display:none;">읽기 권한만 있습니다. 수정/삭제/발송/구독자 관리는 불가합니다.</span>
                    <span class="float-right">총 <span id="font_newsletter_total_itemcount">-</span>개</span>
                </div>

                <div class="table-responsive">
                    <div id="newsletter_send_status" class="alert alert-info py-2 px-3" style="display:none;">
                        뉴스레터를 발송 중입니다. 잠시만 기다려주세요.
                    </div>
                    <table class="table table-bordered bg-white">
                        <thead>
                        <tr>
                            <th style="width:70px;">ID</th>
                            <th style="width:70px;">Vol</th>
                            <th style="width:90px;">삭제여부</th>
                            <th>제목</th>
                            <th style="width:220px;">카테고리</th>
                            <th>요약</th>
                            <th>상세 URL</th>
                            <th style="width:220px;">입력일시/수정일시</th>
                            <th style="width:210px;">관리</th>
                        </tr>
                        </thead>
                        <tbody id="tbody_newsletter_admin_list"></tbody>
                    </table>
                </div>

                <hr class="my-4" />

                <h2 class="h4 mb-2 text-gray-800">뉴스레터 구독 관리</h2>
                <p class="mb-4">구독자 목록 조회 및 구독 상태(구독/해지)를 관리합니다.</p>

                <div class="mb-4">
                    <input type="hidden" id="input_newsletter_subscriber_keyword_changed" value="0" />
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">구독 상태</label>
                        <div class="col-sm-4">
                            <select id="search_newsletter_subscriber_status" class="form-control mb-2" onchange="listener_newsletter_subscriber_keyword_changed();">
                                <option value="" selected="selected">전체</option>
                                <option value="subscribed">구독중</option>
                                <option value="unsubscribed">해지</option>
                            </select>
                        </div>
                        <label class="col-sm-6 col-form-label"></label>

                        <label class="col-sm-2 col-form-label">키워드</label>
                        <div class="col-sm-2">
                            <select class="form-control mb-2" id="search_newsletter_subscriber_keyword_field" onchange="set_newsletter_subscriber_keyword_field()">
                                <option value="10" selected="selected">이름</option>
                                <option value="20">이메일</option>
                            </select>
                        </div>
                        <div class="col-sm-8">
                            <input id="search_newsletter_subscriber_keyword_name" onchange="listener_newsletter_subscriber_keyword_changed();"
                                   class="form-control search_newsletter_subscriber_keyword_each search_newsletter_subscriber_keyword_each_10 mb-2" type="text" placeholder="이름을 입력하세요"/>
                            <input id="search_newsletter_subscriber_keyword_email" onchange="listener_newsletter_subscriber_keyword_changed();"
                                   class="form-control search_newsletter_subscriber_keyword_each search_newsletter_subscriber_keyword_each_20 mb-2 hide" type="text" placeholder="이메일을 입력하세요"/>
                        </div>

                        <input type="hidden" id="cursor_newsletter_subscriber" />
                        <label class="col-sm-2 col-form-label">검색 기준</label>
                        <div class="col-sm-2">
                            <select class="form-control" id="search_newsletter_subscriber_orderby" onchange="listener_newsletter_subscriber_keyword_changed();">
                                <option value="id" selected="selected">등록순</option>
                            </select>
                        </div>
                        <label class="col-sm-2 col-form-label">한번에 불러올 갯수</label>
                        <div class="col-sm-2">
                            <select id="search_newsletter_subscriber_perpage" class="form-control" onchange="listener_newsletter_subscriber_keyword_changed();">
                                <option value="10">10</option>
                                <option value="50" selected="selected">50</option>
                                <option value="100">100</option>
                            </select>
                        </div>
                        <label class="col-sm-2 col-form-label">조회방향</label>
                        <div class="col-sm-2">
                            <select id="search_newsletter_subscriber_orderway" class="form-control" onchange="listener_newsletter_subscriber_keyword_changed();">
                                <option value="DESC" selected="selected">역방향</option>
                                <option value="ASC">정방향</option>
                            </select>
                        </div>

                        <label class="col-sm-10 col-form-label"></label>
                        <div class="col-sm-2 text-right">
                            <button class="btn btn-sm btn-outline-secondary" onclick="reset_newsletter_subscriber_search(); return false;">초기화</button>
                        </div>
                    </div>
                </div>

                <div class="w-100 mb-2">
                    <span class="float-right">총 <span id="font_newsletter_subscriber_total_itemcount">-</span>개</span>
                </div>

                <div class="table-responsive">
                    <table class="table table-bordered bg-white">
                        <thead>
                        <tr>
                            <th style="width:70px;">ID</th>
                            <th style="width:110px;">상태</th>
                            <th style="width:150px;">이름</th>
                            <th>이메일</th>
                            <th style="width:100px;">개인정보 동의</th>
                            <th style="width:180px;">구독일시</th>
                            <th style="width:140px;">관리</th>
                        </tr>
                        </thead>
                        <tbody id="tbody_newsletter_subscriber_admin_list"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <th:block th:replace="~{includes/admin/footer}" />
    </div>
</div>

<div class="modal fade" id="newsletterEditModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">뉴스레터 편집</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit_newsletter_id" />
                <div class="form-row">
                    <div class="form-group col-md-3">
                        <label for="edit_newsletter_vol">Vol</label>
                        <input id="edit_newsletter_vol" type="number" min="0" class="form-control" placeholder="14">
                    </div>
                    <div class="form-group col-md-9">
                        <label for="edit_newsletter_title">제목</label>
                        <input id="edit_newsletter_title" type="text" class="form-control" placeholder="제목을 입력하세요">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="edit_newsletter_category">카테고리</label>
                        <input id="edit_newsletter_category" type="hidden" />
                        <div class="input-group mb-2">
                            <input id="edit_newsletter_category_input" type="text" class="form-control" placeholder="카테고리 입력 후 Enter 또는 쉼표">
                            <div class="input-group-append">
                                <button class="btn btn-outline-secondary" type="button" onclick="add_edit_newsletter_category_from_input();">추가</button>
                            </div>
                        </div>
                        <div id="edit_newsletter_category_tag_list" class="d-flex flex-wrap"></div>
                        <small class="text-muted">여러 개 입력 가능 (예: company, student, interview)</small>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="edit_newsletter_img">이미지 URL</label>
                        <input id="edit_newsletter_img" type="text" class="form-control" placeholder="/image/... 또는 https://...">
                        <input type="file" class="form-control mt-2" id="newsletter_img" accept="image/*" onchange="listenerSetImage(this, listener_upload_newsletter_img)" />
                        <img class="hide mt-2" id="img_newsletter_img" style="height: 75px;" alt="뉴스레터 이미지" />
                    </div>
                </div>
                <div class="form-group">
                    <label for="edit_newsletter_detail_url">상세 URL</label>
                    <input id="edit_newsletter_detail_url" type="text" class="form-control" placeholder="https://...">
                </div>
                <div class="form-group mb-0">
                    <label for="edit_newsletter_summary">요약</label>
                    <textarea id="edit_newsletter_summary" class="form-control" rows="4" placeholder="요약을 입력하세요"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">닫기</button>
                <button id="btn_newsletter_save" type="button" class="btn btn-primary" onclick="save_newsletter_admin();">저장</button>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{includes/admin/bottom}" />

<script>
    let newsletterAdminRows = [];
    let newsletterSubscriberAdminRows = [];
    let newsletterAdminCanManage = false;
    let editNewsletterCategories = [];
    let newsletterSendInProgress = false;
    let newsletterSendButtonEl = null;

    $(document).ready(function(){
        $("#search_newsletter_keyword").on("keydown", function(e){
            if(e.key === "Enter"){
                listener_newsletter_keyword_changed();
            }
        });
        $("#search_newsletter_category").on("keydown", function(e){
            if(e.key === "Enter"){
                listener_newsletter_keyword_changed();
            }
        });
        $("#search_newsletter_subscriber_keyword_name").on("keydown", function(e){
            if(e.key === "Enter"){
                listener_newsletter_subscriber_keyword_changed();
            }
        });
        $("#search_newsletter_subscriber_keyword_email").on("keydown", function(e){
            if(e.key === "Enter"){
                listener_newsletter_subscriber_keyword_changed();
            }
        });
        $("#edit_newsletter_category_input").on("keydown", function(e){
            if (e.key === "Enter" || e.key === ",") {
                e.preventDefault();
                add_edit_newsletter_category_from_input();
            }
        });
        $("#edit_newsletter_img").on("input", function(){
            sync_newsletter_img_preview_from_input();
        });
        set_newsletter_keyword_field(false);
        set_newsletter_subscriber_keyword_field(false);
        resolve_newsletter_manage_permission(function(){
            reload_newsletter_admin();
            if(newsletterAdminCanManage){
                reload_newsletter_subscriber_admin();
            } else {
                render_newsletter_subscriber_access_denied();
            }
        });
    });

    function resolve_newsletter_manage_permission(callback){
        let _data = new Map();
        _data.url = "/api/permissiondetail/allow";
        _data.type = "POST";
        _data.param = {
            target: "news_letter",
            func: 120
        };
        _data.success = function(res){
            newsletterAdminCanManage = !!(res && res.allowed === true);
            sync_newsletter_manage_ui();
            if (callback) { callback(); }
        };
        _data.error = function(){
            newsletterAdminCanManage = false;
            sync_newsletter_manage_ui();
            if (callback) { callback(); }
        };
        func_ajax(_data);
    }

    function sync_newsletter_manage_ui(){
        if(newsletterAdminCanManage){
            $("#btn_newsletter_create").show();
            $("#newsletter_readonly_msg").hide();
            return;
        }
        $("#btn_newsletter_create").hide();
        $("#newsletter_readonly_msg").show();
    }

    function listener_newsletter_keyword_changed(){
        $("#input_newsletter_keyword_changed").val("1");
        reload_newsletter_admin();
    }

    function listener_newsletter_subscriber_keyword_changed(){
        $("#input_newsletter_subscriber_keyword_changed").val("1");
        reload_newsletter_subscriber_admin();
    }

    function set_newsletter_keyword_field(shouldReload){
        let field = $("#search_newsletter_keyword_field").val() || "10";
        $(".search_newsletter_keyword_each").addClass("hide");
        $(".search_newsletter_keyword_each_" + field).removeClass("hide");
        if(shouldReload !== false){
            listener_newsletter_keyword_changed();
        }
    }

    function set_newsletter_subscriber_keyword_field(shouldReload){
        let field = $("#search_newsletter_subscriber_keyword_field").val() || "10";
        $(".search_newsletter_subscriber_keyword_each").addClass("hide");
        $(".search_newsletter_subscriber_keyword_each_" + field).removeClass("hide");
        if(shouldReload !== false){
            listener_newsletter_subscriber_keyword_changed();
        }
    }

    function reset_newsletter_search(){
        $("#search_newsletter_deleted").val("");
        $("#search_newsletter_sdate").val("");
        $("#search_newsletter_fdate").val("");
        $("#search_newsletter_keyword_field").val("10");
        $("#search_newsletter_keyword").val("");
        $("#search_newsletter_category").val("");
        $("#search_newsletter_orderby").val("id");
        $("#search_newsletter_orderway").val("DESC");
        $("#search_newsletter_perpage").val("50");
        set_newsletter_keyword_field(false);
        reload_newsletter_admin();
    }

    function reset_newsletter_subscriber_search(){
        $("#search_newsletter_subscriber_keyword_field").val("10");
        $("#search_newsletter_subscriber_keyword_name").val("");
        $("#search_newsletter_subscriber_keyword_email").val("");
        $("#search_newsletter_subscriber_status").val("");
        $("#search_newsletter_subscriber_orderby").val("id");
        $("#search_newsletter_subscriber_orderway").val("DESC");
        $("#search_newsletter_subscriber_perpage").val("50");
        set_newsletter_subscriber_keyword_field(false);
        reload_newsletter_subscriber_admin();
    }

    function reload_newsletter_admin(){
        let keywordField = $("#search_newsletter_keyword_field").val() || "10";
        let keyword = "";
        let category = "";
        if(keywordField === "20"){
            category = $("#search_newsletter_category").val();
        } else {
            keyword = $("#search_newsletter_keyword").val();
        }

        let _data = new Map();
        _data.url = "/api/newsletter/scrollList";
        _data.type = "GET";
        _data.param = {
            perpage: Number($("#search_newsletter_perpage").val() || 50),
            orderby: $("#search_newsletter_orderby").val() || "id",
            orderway: $("#search_newsletter_orderway").val() || "DESC",
            cursor: null,
            sdate: $("#search_newsletter_sdate").val(),
            fdate: $("#search_newsletter_fdate").val(),
            deleted: listenerGetBooleanFromSelect("search_newsletter_deleted"),
            keyword: keyword,
            category: category
        };
        _data.success = function(list){
            newsletterAdminRows = list || [];
            render_newsletter_admin_rows();
        };
        _data.error = function(){
            newsletterAdminRows = [];
            $("#font_newsletter_total_itemcount").text("0");
            alert("뉴스레터 목록을 불러오지 못했습니다.");
        };
        func_ajax(_data);
    }

    function reload_newsletter_subscriber_admin(){
        if(!newsletterAdminCanManage){
            render_newsletter_subscriber_access_denied();
            return;
        }

        let subscribedFilter = null;
        let statusValue = ($("#search_newsletter_subscriber_status").val() || "").trim();
        if(statusValue === "subscribed"){
            subscribedFilter = true;
        } else if(statusValue === "unsubscribed"){
            subscribedFilter = false;
        }
        let keywordField = $("#search_newsletter_subscriber_keyword_field").val() || "10";
        let keyword = "";
        if(keywordField === "20"){
            keyword = $("#search_newsletter_subscriber_keyword_email").val();
        } else {
            keyword = $("#search_newsletter_subscriber_keyword_name").val();
        }

        let _data = new Map();
        _data.url = "/api/newsletter/subscriber/scrollList";
        _data.type = "GET";
        _data.param = {
            perpage: Number($("#search_newsletter_subscriber_perpage").val() || 50),
            orderby: $("#search_newsletter_subscriber_orderby").val() || "id",
            orderway: $("#search_newsletter_subscriber_orderway").val() || "DESC",
            cursor: null,
            keyword: keyword,
            subscribed: subscribedFilter
        };
        _data.success = function(list){
            newsletterSubscriberAdminRows = list || [];
            render_newsletter_subscriber_admin_rows();
        };
        _data.error = function(){
            newsletterSubscriberAdminRows = [];
            $("#font_newsletter_subscriber_total_itemcount").text("0");
            alert("구독자 목록을 불러오지 못했습니다.");
            render_newsletter_subscriber_admin_rows();
        };
        func_ajax(_data);
    }

    function render_newsletter_admin_rows(){
        let tbody = $("#tbody_newsletter_admin_list");
        tbody.html("");
        $("#font_newsletter_total_itemcount").text(newsletterAdminRows.length);

        if(newsletterAdminRows.length === 0){
            tbody.append("<tr><td colspan='9' class='text-center text-muted'>등록된 뉴스레터가 없습니다.</td></tr>");
            return;
        }

        for(let row of newsletterAdminRows){
            let id = row.id == null ? "-" : row.id;
            let vol = row.vol == null ? "-" : row.vol;
            let deletedText = row.deleted === true ? "삭제" : "일반";
            let title = escape_html(row.title || "");
            let category = render_newsletter_category_badges(row.category);
            let summary = escape_html(row.summary || "");
            let detailUrl = row.detailUrl || "";
            let detailMarkup = detailUrl
                ? ("<a href='" + escape_attr(detailUrl) + "' target='_blank' rel='noopener noreferrer'>열기</a>")
                : "-";
            let createdAt = format_datetime_display(row.createdAt);
            let modifiedAt = format_datetime_display(row.modifiedAt);
            let dateInfo = createdAt + " / " + modifiedAt;

            let actionMarkup = "<span class='text-muted'>조회 전용</span>";
            if(newsletterAdminCanManage && row.id != null){
                actionMarkup = ""
                    + "<button class='btn btn-sm btn-outline-primary mr-1' onclick='open_edit_newsletter_modal(" + row.id + "); return false;'>수정</button>"
                    + "<button class='btn btn-sm btn-outline-danger mr-1' onclick='delete_newsletter_admin(" + row.id + "); return false;'>삭제</button>"
                    + "<button class='btn btn-sm btn-primary js-newsletter-send' onclick='send_newsletter_admin(this, " + row.id + ", \"" + escape_js(row.title || "") + "\"); return false;'>발송</button>";
            }

            let tr = ""
                + "<tr>"
                + "<td>" + id + "</td>"
                + "<td>" + vol + "</td>"
                + "<td>" + deletedText + "</td>"
                + "<td>" + title + "</td>"
                + "<td>" + category + "</td>"
                + "<td>" + summary + "</td>"
                + "<td>" + detailMarkup + "</td>"
                + "<td>" + dateInfo + "</td>"
                + "<td>" + actionMarkup + "</td>"
                + "</tr>";
            tbody.append(tr);
        }
    }

    function render_newsletter_subscriber_access_denied(){
        newsletterSubscriberAdminRows = [];
        let tbody = $("#tbody_newsletter_subscriber_admin_list");
        tbody.html("");
        $("#font_newsletter_subscriber_total_itemcount").text("-");
        tbody.append("<tr><td colspan='7' class='text-center text-muted'>구독자 관리 권한이 없습니다.</td></tr>");
    }

    function render_newsletter_subscriber_admin_rows(){
        let tbody = $("#tbody_newsletter_subscriber_admin_list");
        tbody.html("");
        $("#font_newsletter_subscriber_total_itemcount").text(newsletterSubscriberAdminRows.length);

        if(!newsletterAdminCanManage){
            render_newsletter_subscriber_access_denied();
            return;
        }

        if(newsletterSubscriberAdminRows.length === 0){
            tbody.append("<tr><td colspan='7' class='text-center text-muted'>등록된 구독자가 없습니다.</td></tr>");
            return;
        }

        for(let row of newsletterSubscriberAdminRows){
            let id = row.id == null ? "-" : row.id;
            let name = escape_html(row.name || "-");
            let email = escape_html(row.email || "-");
            let agreePrivacy = row.agreePrivacy === true ? "Y" : "N";
            let subscribedAt = format_datetime_display(row.subscribedAt);
            let subscribed = row.subscribed === true;
            let statusBadge = subscribed
                ? "<span class='badge badge-success'>구독중</span>"
                : "<span class='badge badge-secondary'>해지</span>";

            let actionMarkup = "<span class='text-muted'>-</span>";
            if(row.id != null){
                if(subscribed){
                    actionMarkup = "<button class='btn btn-sm btn-outline-danger' onclick='toggle_newsletter_subscriber(" + row.id + ", false); return false;'>구독해지</button>";
                } else {
                    actionMarkup = "<button class='btn btn-sm btn-outline-primary' onclick='toggle_newsletter_subscriber(" + row.id + ", true); return false;'>재구독</button>";
                }
            }

            let tr = ""
                + "<tr>"
                + "<td>" + id + "</td>"
                + "<td>" + statusBadge + "</td>"
                + "<td>" + name + "</td>"
                + "<td>" + email + "</td>"
                + "<td>" + agreePrivacy + "</td>"
                + "<td>" + subscribedAt + "</td>"
                + "<td>" + actionMarkup + "</td>"
                + "</tr>";
            tbody.append(tr);
        }
    }

    function open_create_newsletter_modal(){
        if(!newsletterAdminCanManage){
            alert("수정 권한이 없습니다.");
            return;
        }
        $("#edit_newsletter_id").val("");
        $("#edit_newsletter_vol").val("");
        $("#edit_newsletter_title").val("");
        set_edit_newsletter_categories("");
        $("#edit_newsletter_img").val("");
        $("#newsletter_img").val("");
        sync_newsletter_img_preview("");
        $("#edit_newsletter_detail_url").val("");
        $("#edit_newsletter_summary").val("");
        $("#newsletterEditModal").modal("show");
    }

    function open_edit_newsletter_modal(id){
        if(!newsletterAdminCanManage){
            alert("수정 권한이 없습니다.");
            return;
        }
        let row = find_newsletter_admin_row(id);
        if(!row){
            alert("대상을 찾을 수 없습니다.");
            return;
        }
        $("#edit_newsletter_id").val(row.id || "");
        $("#edit_newsletter_vol").val(row.vol == null ? "" : row.vol);
        $("#edit_newsletter_title").val(row.title || "");
        set_edit_newsletter_categories(row.category || "");
        $("#edit_newsletter_img").val(row.img || "");
        $("#newsletter_img").val("");
        sync_newsletter_img_preview(row.img || "");
        $("#edit_newsletter_detail_url").val(row.detailUrl || "");
        $("#edit_newsletter_summary").val(row.summary || "");
        $("#newsletterEditModal").modal("show");
    }

    function listener_upload_newsletter_img(){
        let tempFile = null;
        let inputFile = document.getElementById("newsletter_img");
        if (inputFile.files.length > 0) {
            tempFile = inputFile.files[0];
        }
        if (tempFile == null) {
            return;
        }

        let fileData = new FormData();
        fileData.append("file", tempFile);
        $.ajax({
            url: "/api/default/uploadFile",
            type: "POST",
            data: fileData,
            cache: false,
            contentType: false,
            processData: false,
            success: (data)=>{
                let imagePath = "/image/" + data;
                $("#edit_newsletter_img").val(imagePath);
                sync_newsletter_img_preview(imagePath);
            },
            error: ()=>{
                alert("이미지 업로드에 실패했습니다.");
            }
        });
    }

    function sync_newsletter_img_preview_from_input(){
        sync_newsletter_img_preview($("#edit_newsletter_img").val());
    }

    function sync_newsletter_img_preview(url){
        let value = (url || "").trim();
        let preview = $("#img_newsletter_img");
        if(!value){
            preview.attr("src", "");
            preview.addClass("hide");
            return;
        }
        preview.attr("src", value);
        preview.removeClass("hide");
    }

    function save_newsletter_admin(){
        if(!newsletterAdminCanManage){
            alert("수정 권한이 없습니다.");
            return;
        }

        let id = to_number_or_null($("#edit_newsletter_id").val());
        let title = ($("#edit_newsletter_title").val() || "").trim();
        if(!title){
            alert("제목을 입력해주세요.");
            return;
        }

        let payload = {
            vol: to_number_or_null($("#edit_newsletter_vol").val()),
            title: title,
            category: ($("#edit_newsletter_category").val() || "").trim(),
            img: ($("#edit_newsletter_img").val() || "").trim(),
            detailUrl: ($("#edit_newsletter_detail_url").val() || "").trim(),
            summary: ($("#edit_newsletter_summary").val() || "").trim()
        };

        let _data = new Map();
        if(id == null){
            _data.url = "/api/newsletter";
            _data.type = "POST";
            _data.param = payload;
        } else {
            payload.id = id;
            _data.url = "/api/newsletter";
            _data.type = "PUT";
            _data.param = payload;
        }

        _data.success = function(){
            $("#newsletterEditModal").modal("hide");
            reload_newsletter_admin();
        };
        _data.error = function(){
            alert("저장에 실패했습니다. 권한 또는 입력값을 확인해주세요.");
        };
        func_ajax(_data);
    }

    function delete_newsletter_admin(id){
        if(!newsletterAdminCanManage){
            alert("삭제 권한이 없습니다.");
            return;
        }
        if(!confirm("선택한 뉴스레터를 삭제하시겠습니까?")){
            return;
        }

        let _data = new Map();
        _data.url = "/api/newsletter";
        _data.type = "DELETE";
        _data.param = { id: id };
        _data.success = function(){
            reload_newsletter_admin();
        };
        _data.error = function(){
            alert("삭제에 실패했습니다.");
        };
        func_ajax(_data);
    }

    function send_newsletter_admin(buttonEl, id, title){
        if(!newsletterAdminCanManage){
            alert("발송 권한이 없습니다.");
            return;
        }
        if(newsletterSendInProgress){
            alert("이미 발송 중입니다. 잠시만 기다려주세요.");
            return;
        }

        let msg = "선택한 뉴스레터를 발송할까요?";
        if(title){
            msg = "선택한 뉴스레터를 발송할까요?\n\n제목: " + title;
        }
        if(!confirm(msg)){
            return;
        }

        set_newsletter_send_progress(true, buttonEl);

        let _data = new Map();
        _data.url = "/api/newsletter/send";
        _data.type = "POST";
        _data.param = { id: id };
        _data.success = function(res){
            set_newsletter_send_progress(false);
            let total = res && res.totalCount != null ? res.totalCount : 0;
            let success = res && res.successCount != null ? res.successCount : 0;
            let failed = res && res.failedCount != null ? res.failedCount : 0;
            alert("발송 완료\n전체: " + total + " / 성공: " + success + " / 실패: " + failed);
        };
        _data.error = function(){
            set_newsletter_send_progress(false);
            alert("발송에 실패했습니다.");
        };
        func_ajax(_data);
    }

    function set_newsletter_send_progress(active, buttonEl){
        newsletterSendInProgress = !!active;
        if(newsletterSendInProgress){
            newsletterSendButtonEl = buttonEl || null;
            $("#newsletter_send_status").show();
            $(".js-newsletter-send").prop("disabled", true);
            if(newsletterSendButtonEl){
                let btn = $(newsletterSendButtonEl);
                let originalLabel = btn.attr("data-original-label");
                if(!originalLabel){
                    originalLabel = btn.text();
                    btn.attr("data-original-label", originalLabel);
                }
                btn.html("<span class='spinner-border spinner-border-sm mr-1' role='status' aria-hidden='true'></span>발송중...");
            }
            return;
        }

        $("#newsletter_send_status").hide();
        $(".js-newsletter-send").prop("disabled", false);
        if(newsletterSendButtonEl){
            let btn = $(newsletterSendButtonEl);
            let originalLabel = btn.attr("data-original-label") || "발송";
            btn.text(originalLabel);
            btn.removeAttr("data-original-label");
        }
        newsletterSendButtonEl = null;
    }

    function toggle_newsletter_subscriber(id, subscribed){
        if(!newsletterAdminCanManage){
            alert("구독자 관리 권한이 없습니다.");
            return;
        }

        let actionText = subscribed ? "재구독" : "구독해지";
        if(!confirm("선택한 구독자를 " + actionText + " 처리하시겠습니까?")){
            return;
        }

        let _data = new Map();
        _data.url = "/api/newsletter/subscriber";
        _data.type = "PUT";
        _data.param = {
            id: id,
            subscribed: subscribed
        };
        _data.success = function(){
            reload_newsletter_subscriber_admin();
        };
        _data.error = function(){
            alert(actionText + " 처리에 실패했습니다.");
        };
        func_ajax(_data);
    }

    function find_newsletter_admin_row(id){
        for(let each of newsletterAdminRows){
            if(each.id === id){
                return each;
            }
        }
        return null;
    }

    function format_datetime_display(value){
        if(!value){
            return "-";
        }
        let text = (value + "").trim();
        if(!text){
            return "-";
        }
        if(text.length > 19){
            text = text.substring(0, 19);
        }
        return text.replace("T", " ");
    }

    function split_newsletter_categories(value){
        let raw = (value || "").trim();
        if(!raw){
            return [];
        }
        let tokens = raw.split(/[,\n;]+/);
        let result = [];
        let seen = {};
        for(let each of tokens){
            let token = (each || "").trim();
            if(!token){
                continue;
            }
            if(token.startsWith("#")){
                token = token.substring(1).trim();
            }
            token = token.replace(/\s+/g, " ");
            if(!token){
                continue;
            }
            let lower = token.toLowerCase();
            if(seen[lower]){
                continue;
            }
            seen[lower] = true;
            result.push(token);
        }
        return result;
    }

    function render_newsletter_category_badges(value){
        let categories = split_newsletter_categories(value);
        if(categories.length === 0){
            return "<span class='badge badge-secondary'>미분류</span>";
        }
        let chips = [];
        for(let each of categories){
            chips.push("<span class='badge badge-dark mr-1 mb-1'>" + escape_html(each) + "</span>");
        }
        return chips.join("");
    }

    function set_edit_newsletter_categories(value){
        editNewsletterCategories = split_newsletter_categories(value);
        $("#edit_newsletter_category_input").val("");
        render_edit_newsletter_categories();
    }

    function add_edit_newsletter_category_from_input(){
        let input = $("#edit_newsletter_category_input");
        let value = input.val();
        let tokens = split_newsletter_categories(value);
        if(tokens.length === 0){
            input.val("");
            return;
        }
        let current = split_newsletter_categories(editNewsletterCategories.join(","));
        for(let each of tokens){
            current.push(each);
        }
        editNewsletterCategories = split_newsletter_categories(current.join(","));
        input.val("");
        render_edit_newsletter_categories();
    }

    function remove_edit_newsletter_category(idx){
        if(idx < 0 || idx >= editNewsletterCategories.length){
            return;
        }
        editNewsletterCategories.splice(idx, 1);
        render_edit_newsletter_categories();
    }

    function render_edit_newsletter_categories(){
        let list = $("#edit_newsletter_category_tag_list");
        list.html("");
        if(editNewsletterCategories.length === 0){
            list.append("<span class='text-muted small'>등록된 카테고리가 없습니다.</span>");
        } else {
            for(let i = 0; i < editNewsletterCategories.length; i++){
                let each = editNewsletterCategories[i];
                let chip = ""
                    + "<span class='badge badge-dark mr-1 mb-1'>"
                    + escape_html(each)
                    + " <a href='#' class='text-white ml-1' onclick='remove_edit_newsletter_category(" + i + "); return false;'>&times;</a>"
                    + "</span>";
                list.append(chip);
            }
        }
        $("#edit_newsletter_category").val(editNewsletterCategories.join(", "));
    }

    function to_number_or_null(value){
        if(value == null){
            return null;
        }
        let t = (value + "").trim();
        if(t === ""){
            return null;
        }
        let n = Number(t);
        if(!Number.isFinite(n)){
            return null;
        }
        return n;
    }

    function escape_html(value){
        return (value + "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/\"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    function escape_attr(value){
        return escape_html(value);
    }

    function escape_js(value){
        return (value + "")
            .replace(/\\/g, "\\\\")
            .replace(/"/g, "\\\"")
            .replace(/\n/g, "\\n")
            .replace(/\r/g, "");
    }
</script>
