<!DOCTYPE html>
<html lang="ko">
<th:block th:replace="~{includes/user/head}" />
<link rel="stylesheet" href="/frontswcenter/css/aside.css">
<link rel="stylesheet" href="/frontswcenter/css/newsletter.css">
<body>

<th:block th:replace="~{includes/user/header}" />

<div class="page-layout newsletter-page-layout">
    <div class="newsletter-side-rail">
        <th:block th:replace="~{includes/user/aside}" />

        <section class="newsletter-subscribe">
            <h2>Newsletter</h2>
            <p class="newsletter-description">소중한 하루를 만드는 정보와 이야기를 전하는 월간 온라인 매거진

한동대 소중대 소식, 기업인 인터뷰, 경제 뉴스, 영화 추천 등 다양한 주제를 담아 한 달에 한 번 발간됩니다.
흥미로운 사람들의 이야기와 새로운 시각을 통해 독자 여러분의 하루를 더 가치 있게 만듭니다.</p>

            <div class="newsletter-form-group">
                <input type="text" id="newsletter_subscriber_name" placeholder="Name" />
            </div>
            <div class="newsletter-form-group">
                <input type="email" id="newsletter_subscriber_email" placeholder="Email" />
            </div>
            <label class="newsletter-agree">
                <input type="checkbox" id="newsletter_agree" />
                <span>개인정보 수집 및 이용에 동의합니다.</span>
            </label>

            <button class="newsletter-subscribe-button" onclick="subscribe_newsletter(); return false;">SUBSCRIBE</button>
        </section>
    </div>
    <script> listener_aside_nav_active("news", 2); </script>

    <main class="content-area newsletter-page">
        <div id="newsletter_unsubscribe_notice" class="newsletter-empty mb-3" style="display:none;"></div>
        <div class="newsletter-toolbar">
            <div class="newsletter-search">
                <input type="text" id="newsletter_keyword" placeholder="" />
                <button onclick="reload_newsletter_list(); return false;" aria-label="검색">
                    <span class="newsletter-search-icon" aria-hidden="true"></span>
                </button>
            </div>
        </div>

        <section>
            <div class="newsletter-feed" id="newsletter_list"></div>
            <div class="newsletter-load-wrap" id="newsletter_load_wrap" style="display:none;">
                <button onclick="search_newsletter(); return false;">더보기</button>
            </div>
        </section>
    </main>
</div>

<th:block th:replace="~{includes/user/footer}" />
<th:block th:replace="~{includes/user/bottom}" />

<script>
    const NEWSLETTER_DEFAULT_DETAIL_URL = "https://walab.info/swplus/newsletter/2212_v14/newsletter_v14.html";
    const NEWSLETTER_DEFAULT_IMAGE = "";

    let newsletterCursor = null;
    let newsletterLoading = false;

    $(function(){
        render_newsletter_unsubscribe_notice();
        $("#newsletter_keyword").on("keydown", function(e){
            if (e.key === "Enter") {
                reload_newsletter_list();
            }
        });
        $("#newsletter_category").on("keydown", function(e){
            if (e.key === "Enter") {
                reload_newsletter_list();
            }
        });
        $(document).on("click", ".js-newsletter-popup", function(e){
            e.preventDefault();
            let encodedUrl = $(this).attr("data-popup-url") || "";
            let targetUrl = decodeURIComponent(encodedUrl);
            open_newsletter_popup(targetUrl);
        });
        reload_newsletter_list();
    });

    function render_newsletter_unsubscribe_notice() {
        let params = new URLSearchParams(window.location.search || "");
        let state = (params.get("unsubscribe") || "").trim();
        if (!state) {
            return;
        }

        let target = $("#newsletter_unsubscribe_notice");
        if (state === "success") {
            target.text("뉴스레터 구독이 취소되었습니다.");
            target.show();
            return;
        }
        if (state === "invalid") {
            target.text("유효하지 않은 구독취소 링크입니다.");
            target.show();
        }
    }

    function reload_newsletter_list() {
        newsletterCursor = null;
        $("#newsletter_list").html("");
        $("#newsletter_load_wrap").hide();
        search_newsletter();
    }

    function search_newsletter() {
        if (newsletterLoading) {
            return;
        }
        newsletterLoading = true;

        let _data = new Map();
        _data.url = "/api/newsletter/scrollList";
        _data.type = "GET";
        _data.param = {
            perpage: 6,
            orderby: "id",
            orderway: "DESC",
            cursor: newsletterCursor,
            deleted: false,
            keyword: $("#newsletter_keyword").val(),
            category: $("#newsletter_category").val()
        };
        _data.success = function(list){
            let rows = list || [];
            if (rows.length === 0 && newsletterCursor == null) {
                $("#newsletter_list").html("<div class='newsletter-empty'>등록된 뉴스레터가 없습니다.</div>");
                $("#newsletter_load_wrap").hide();
                newsletterLoading = false;
                return;
            }

            for (let each of rows) {
                append_newsletter_item(each);
            }

            if (rows.length > 0) {
                newsletterCursor = rows[rows.length - 1].id;
            }

            if (rows.length >= 6) {
                $("#newsletter_load_wrap").show();
            } else {
                $("#newsletter_load_wrap").hide();
            }
            newsletterLoading = false;
        };
        _data.error = function(){
            newsletterLoading = false;
            alert("뉴스레터 목록을 불러오지 못했습니다.");
        };
        func_ajax(_data);
    }

    function append_newsletter_item(item) {
        let vol = item.vol == null ? "-" : item.vol;
        let title = escape_html(item.title || "제목 없음");
        let summary = escape_html(item.summary || "");
        let categoryHtml = render_newsletter_category_chips(item.category);
        let img = item.img && (item.img + "").trim() ? item.img : NEWSLETTER_DEFAULT_IMAGE;
        let detailUrl = item.detailUrl && (item.detailUrl + "").trim() ? item.detailUrl : NEWSLETTER_DEFAULT_DETAIL_URL;
        let encodedDetailUrl = encodeURIComponent(detailUrl);
        let href = detailUrl;
        let target = "_blank";

        let thumbMarkup = img
            ? ("<img class='newsletter-thumb' src='" + img + "' alt='뉴스레터 이미지'>")
            : "<div class='newsletter-thumb newsletter-thumb-fallback' aria-hidden='true'></div>";

        let card = ""
            + "<article class='newsletter-item'>"
            + "  <a class='js-newsletter-popup' href='" + href + "' data-popup-url='" + encodedDetailUrl + "' target='" + target + "' rel='noopener noreferrer'>"
            +      thumbMarkup
            + "  </a>"
            + "  <div class='newsletter-body'>"
            + "    <div class='newsletter-vol'>Vol." + vol + "</div>"
            + "    <a class='newsletter-title js-newsletter-popup' href='" + href + "' data-popup-url='" + encodedDetailUrl + "' target='" + target + "' rel='noopener noreferrer'>" + title + "</a>"
            + "    <div class='newsletter-summary'>" + summary + "</div>"
            + "    <div class='newsletter-meta-row'>"
            +        categoryHtml
            + "    </div>"
            + "  </div>"
            + "</article>";

        $("#newsletter_list").append(card);
    }

    function subscribe_newsletter() {
        let name = ($("#newsletter_subscriber_name").val() || "").trim();
        let email = ($("#newsletter_subscriber_email").val() || "").trim();
        let agree = $("#newsletter_agree").is(":checked");

        if (!name) {
            alert("이름을 입력해주세요.");
            return;
        }
        if (!email || email.indexOf("@") < 1 || email.endsWith("@")) {
            alert("올바른 이메일을 입력해주세요.");
            return;
        }
        if (!agree) {
            alert("개인정보 수집 및 이용 동의가 필요합니다.");
            return;
        }

        let _data = new Map();
        _data.url = "/api/newsletter/subscribe";
        _data.type = "POST";
        _data.param = {
            name: name,
            email: email,
            agreePrivacy: agree
        };
        _data.success = function(){
            alert("구독 신청이 완료되었습니다.");
            $("#newsletter_subscriber_name").val("");
            $("#newsletter_subscriber_email").val("");
            $("#newsletter_agree").prop("checked", false);
        };
        _data.error = function(){
            alert("구독 신청에 실패했습니다. 잠시 후 다시 시도해주세요.");
        };
        func_ajax(_data);
    }

    function open_newsletter_popup(url) {
        let targetUrl = (url || "").trim();
        if (!targetUrl) {
            targetUrl = NEWSLETTER_DEFAULT_DETAIL_URL;
        }

        const width = 1200;
        const height = 800;
        const left = Math.max(0, Math.round((window.screen.width - width) / 2));
        const top = Math.max(0, Math.round((window.screen.height - height) / 2));
        const options = "width=" + width
            + ",height=" + height
            + ",left=" + left
            + ",top=" + top
            + ",resizable=yes,scrollbars=yes";

        const popup = window.open(targetUrl, "newsletterPopup", options);
        if (popup) {
            popup.focus();
            return;
        }

        window.open(targetUrl, "_blank", "noopener,noreferrer");
    }

    function escape_html(value) {
        return (value + "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/\"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    function split_newsletter_categories(value) {
        let raw = (value || "").trim();
        if (!raw) {
            return [];
        }
        let tokens = raw.split(/[,\n;]+/);
        let result = [];
        let seen = {};
        for (let each of tokens) {
            let token = (each || "").trim();
            if (!token) {
                continue;
            }
            if (token.startsWith("#")) {
                token = token.substring(1).trim();
            }
            token = token.replace(/\s+/g, " ");
            if (!token) {
                continue;
            }
            let lower = token.toLowerCase();
            if (seen[lower]) {
                continue;
            }
            seen[lower] = true;
            result.push(token);
        }
        return result;
    }

    function render_newsletter_category_chips(value) {
        let categories = split_newsletter_categories(value);
        if (categories.length === 0) {
            return "<span class='newsletter-category-chip newsletter-category-chip-empty'>미분류</span>";
        }
        let chips = "";
        for (let each of categories) {
            chips += "<span class='newsletter-category-chip'>" + escape_html(each) + "</span>";
        }
        return "<span class='newsletter-category-list'>" + chips + "</span>";
    }
</script>

</body>
</html>
