<!DOCTYPE html>
<html lang="ko">
<th:block th:replace="~{includes/user/head}" />
<link rel="stylesheet" href="/frontswcenter/css/aside.css">
<link rel="stylesheet" href="/frontswcenter/css/extracurricular.css">
<body>

<th:block th:replace="~{includes/user/header}" />

<div class="page-layout">
    <th:block th:replace="~{includes/user/aside}" />
    <script> listener_aside_nav_active("news", 3); </script>

    <main class="content-area extracurricular-page">
        <div class="extracurricular-toolbar">
            <div class="extracurricular-search">
                <input type="text" id="extracurricular_keyword" placeholder="검색어를 입력하세요" />
                <button onclick="reload_extracurricular_list(); return false;" aria-label="검색">⌕</button>
            </div>
        </div>

        <section>
            <div class="extracurricular-grid" id="extracurricular_list"></div>
            <div class="extracurricular-load-wrap" id="extracurricular_load_wrap" style="display:none;">
                <button onclick="search_extracurricular(); return false;">더보기</button>
            </div>
        </section>
    </main>
</div>

<th:block th:replace="~{includes/user/footer}" />
<th:block th:replace="~{includes/user/bottom}" />

<script>
    const EXTRACURRICULAR_DEFAULT_DETAIL_URL = "https://walab.info/swplus/newsletter/2212_v14/newsletter_v14.html";
    const EXTRACURRICULAR_DEFAULT_IMAGE = "/frontswcenter/img/value-spread/test06.jpg";

    let extracurricularCursor = null;
    let extracurricularLoading = false;

    $(function(){
        $("#extracurricular_keyword").on("keydown", function(e){
            if (e.key === "Enter") {
                reload_extracurricular_list();
            }
        });
        $(document).on("click", ".js-extracurricular-popup", function(e){
            e.preventDefault();
            let encodedUrl = $(this).attr("data-popup-url") || "";
            let targetUrl = decodeURIComponent(encodedUrl);
            open_extracurricular_popup(targetUrl);
        });
        reload_extracurricular_list();
    });

    function reload_extracurricular_list() {
        extracurricularCursor = null;
        $("#extracurricular_list").html("");
        $("#extracurricular_load_wrap").hide();
        search_extracurricular();
    }

    function search_extracurricular() {
        if (extracurricularLoading) {
            return;
        }
        extracurricularLoading = true;

        let _data = new Map();
        _data.url = "/api/extracurricular_activities/scrollList";
        _data.type = "GET";
        _data.param = {
            perpage: 6,
            orderby: "id",
            orderway: "DESC",
            cursor: extracurricularCursor,
            deleted: false,
            keyword: $("#extracurricular_keyword").val()
        };
        _data.success = function(list){
            let rows = list || [];
            if (rows.length === 0 && extracurricularCursor == null) {
                $("#extracurricular_list").html("<div class='extracurricular-empty'>등록된 대외활동 소식이 없습니다.</div>");
                $("#extracurricular_load_wrap").hide();
                extracurricularLoading = false;
                return;
            }

            for (let each of rows) {
                append_extracurricular_item(each);
            }

            if (rows.length > 0) {
                extracurricularCursor = rows[rows.length - 1].id;
            }

            if (rows.length >= 6) {
                $("#extracurricular_load_wrap").show();
            } else {
                $("#extracurricular_load_wrap").hide();
            }
            extracurricularLoading = false;
        };
        _data.error = function(){
            extracurricularLoading = false;
            alert("대외활동 목록을 불러오지 못했습니다.");
        };
        func_ajax(_data);
    }

    function append_extracurricular_item(item) {
        let title = escape_html(item.title || "제목 없음");
        let subtitle = escape_html(item.summary || "");
        let img = EXTRACURRICULAR_DEFAULT_IMAGE;
        let detailUrl = item.detailUrl && (item.detailUrl + "").trim() ? item.detailUrl : EXTRACURRICULAR_DEFAULT_DETAIL_URL;
        let encodedDetailUrl = encodeURIComponent(detailUrl);

        let card = ""
            + "<article class='extracurricular-card'>"
            + "  <a class='extracurricular-link js-extracurricular-popup' href='" + detailUrl + "' data-popup-url='" + encodedDetailUrl + "' target='_blank' rel='noopener noreferrer'>"
            + "    <img class='extracurricular-thumb' src='" + img + "' alt='대외활동 이미지'>"
            + "    <div class='extracurricular-overlay'>"
            + "      <div class='extracurricular-subtitle'>" + subtitle + "</div>"
            + "      <div class='extracurricular-title'>" + title + "</div>"
            + "    </div>"
            + "  </a>"
            + "</article>";

        $("#extracurricular_list").append(card);
    }

    function open_extracurricular_popup(url) {
        let targetUrl = (url || "").trim();
        if (!targetUrl) {
            targetUrl = EXTRACURRICULAR_DEFAULT_DETAIL_URL;
        }
        const width = 1200;
        const height = 800;
        const left = Math.max(0, Math.round((window.screen.width - width) / 2));
        const top = Math.max(0, Math.round((window.screen.height - height) / 2));
        const options = "width=" + width
            + ",height=" + height
            + ",left=" + left
            + ",top=" + top
            + ",resizable=yes,scrollbars=yes";

        const popup = window.open(targetUrl, "extracurricularPopup", options);
        if (popup) {
            popup.focus();
            return;
        }

        window.open(targetUrl, "_blank", "noopener,noreferrer");
    }

    function escape_html(value) {
        return (value + "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/\"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }
</script>

</body>
</html>
