<!DOCTYPE html>
<html lang="en">

<th:block th:replace="~{includes/admin/head}" />

<body id="page-top">

<div id="wrapper">

    <th:block th:replace="~{includes/admin/sidebar}" />
    <script>
        $(".nav_extracurricular_activities_a").removeClass("collapsed");
        $(".nav_extracurricular_activities_div").addClass("show");
    </script>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <th:block th:replace="~{includes/admin/topbar}" />

            <div class="container-fluid">
                <h1 class="h3 mb-2 text-gray-800">대외활동 관리</h1>
                <p class="mb-4">대외활동 목록 조회, 등록, 수정, 삭제를 관리합니다.</p>

                <div class="card shadow mb-3">
                    <div class="card-body">
                        <div class="form-row">
                            <div class="col-md-6 mb-2">
                                <label for="search_extracurricular_keyword">검색어</label>
                                <input id="search_extracurricular_keyword" type="text" class="form-control" placeholder="제목/요약 검색">
                            </div>
                            <div class="col-md-3 mb-2">
                                <label for="search_extracurricular_perpage">조회 건수</label>
                                <select id="search_extracurricular_perpage" class="form-control">
                                    <option value="20">20</option>
                                    <option value="50" selected="selected">50</option>
                                    <option value="100">100</option>
                                </select>
                            </div>
                            <div class="col-md-3 mb-2 d-flex align-items-end">
                                <button class="btn btn-primary mr-2" onclick="reload_extracurricular_admin(); return false;">조회</button>
                                <button class="btn btn-outline-secondary" onclick="reset_extracurricular_search(); return false;">초기화</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mb-2">
                    <button id="btn_extracurricular_create" class="btn btn-primary" onclick="open_create_extracurricular_modal(); return false;">대외활동 등록</button>
                    <span id="extracurricular_readonly_msg" class="text-muted ml-2" style="display:none;">읽기 권한만 있습니다. 수정/삭제는 불가합니다.</span>
                </div>

                <div class="table-responsive">
                    <table class="table table-bordered bg-white">
                        <thead>
                        <tr>
                            <th style="width:70px;">ID</th>
                            <th>제목</th>
                            <th>요약</th>
                            <th style="width:130px;">상세 URL</th>
                            <th style="width:170px;">관리</th>
                        </tr>
                        </thead>
                        <tbody id="tbody_extracurricular_admin_list"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <th:block th:replace="~{includes/admin/footer}" />
    </div>
</div>

<div class="modal fade" id="extracurricularEditModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">대외활동 편집</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit_extracurricular_id" />
                <div class="form-group">
                    <label for="edit_extracurricular_title">제목</label>
                    <input id="edit_extracurricular_title" type="text" class="form-control" placeholder="제목을 입력하세요">
                </div>
                <div class="form-group">
                    <label for="edit_extracurricular_detail_url">상세 URL</label>
                    <input id="edit_extracurricular_detail_url" type="text" class="form-control" placeholder="https://...">
                </div>
                <div class="form-group mb-0">
                    <label for="edit_extracurricular_summary">요약</label>
                    <textarea id="edit_extracurricular_summary" class="form-control" rows="4" placeholder="요약을 입력하세요"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">닫기</button>
                <button id="btn_extracurricular_save" type="button" class="btn btn-primary" onclick="save_extracurricular_admin();">저장</button>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{includes/admin/bottom}" />

<script>
    let extracurricularAdminRows = [];
    let extracurricularAdminCanManage = false;

    $(document).ready(function(){
        $("#search_extracurricular_keyword").on("keydown", function(e){
            if(e.key === "Enter"){
                reload_extracurricular_admin();
            }
        });
        resolve_extracurricular_manage_permission(function(){
            reload_extracurricular_admin();
        });
    });

    function resolve_extracurricular_manage_permission(callback){
        let _data = new Map();
        _data.url = "/api/permissiondetail/allow";
        _data.type = "POST";
        _data.param = {
            target: "extracurricular_activities",
            func: 120
        };
        _data.success = function(res){
            extracurricularAdminCanManage = !!(res && res.allowed === true);
            sync_extracurricular_manage_ui();
            if (callback) { callback(); }
        };
        _data.error = function(){
            extracurricularAdminCanManage = false;
            sync_extracurricular_manage_ui();
            if (callback) { callback(); }
        };
        func_ajax(_data);
    }

    function sync_extracurricular_manage_ui(){
        if(extracurricularAdminCanManage){
            $("#btn_extracurricular_create").show();
            $("#extracurricular_readonly_msg").hide();
            return;
        }
        $("#btn_extracurricular_create").hide();
        $("#extracurricular_readonly_msg").show();
    }

    function reset_extracurricular_search(){
        $("#search_extracurricular_keyword").val("");
        $("#search_extracurricular_perpage").val("50");
        reload_extracurricular_admin();
    }

    function reload_extracurricular_admin(){
        let _data = new Map();
        _data.url = "/api/extracurricular_activities/scrollList";
        _data.type = "GET";
        _data.param = {
            perpage: Number($("#search_extracurricular_perpage").val() || 50),
            orderby: "id",
            orderway: "DESC",
            cursor: null,
            deleted: false,
            keyword: $("#search_extracurricular_keyword").val()
        };
        _data.success = function(list){
            extracurricularAdminRows = list || [];
            render_extracurricular_admin_rows();
        };
        _data.error = function(){
            alert("대외활동 목록을 불러오지 못했습니다.");
        };
        func_ajax(_data);
    }

    function render_extracurricular_admin_rows(){
        let tbody = $("#tbody_extracurricular_admin_list");
        tbody.html("");

        if(extracurricularAdminRows.length === 0){
            tbody.append("<tr><td colspan='5' class='text-center text-muted'>등록된 대외활동이 없습니다.</td></tr>");
            return;
        }

        for(let row of extracurricularAdminRows){
            let id = row.id == null ? "-" : row.id;
            let title = escape_html(row.title || "");
            let summary = escape_html(row.summary || "");
            let detailUrl = row.detailUrl || "";
            let detailMarkup = detailUrl
                ? ("<a href='" + escape_attr(detailUrl) + "' target='_blank' rel='noopener noreferrer'>열기</a>")
                : "-";

            let actionMarkup = "<span class='text-muted'>조회 전용</span>";
            if(extracurricularAdminCanManage && row.id != null){
                actionMarkup = ""
                    + "<button class='btn btn-sm btn-outline-primary mr-1' onclick='open_edit_extracurricular_modal(" + row.id + "); return false;'>수정</button>"
                    + "<button class='btn btn-sm btn-outline-danger' onclick='delete_extracurricular_admin(" + row.id + "); return false;'>삭제</button>";
            }

            let tr = ""
                + "<tr>"
                + "<td>" + id + "</td>"
                + "<td>" + title + "</td>"
                + "<td>" + summary + "</td>"
                + "<td>" + detailMarkup + "</td>"
                + "<td>" + actionMarkup + "</td>"
                + "</tr>";
            tbody.append(tr);
        }
    }

    function open_create_extracurricular_modal(){
        if(!extracurricularAdminCanManage){
            alert("수정 권한이 없습니다.");
            return;
        }
        $("#edit_extracurricular_id").val("");
        $("#edit_extracurricular_title").val("");
        $("#edit_extracurricular_detail_url").val("");
        $("#edit_extracurricular_summary").val("");
        $("#extracurricularEditModal").modal("show");
    }

    function open_edit_extracurricular_modal(id){
        if(!extracurricularAdminCanManage){
            alert("수정 권한이 없습니다.");
            return;
        }
        let row = find_extracurricular_admin_row(id);
        if(!row){
            alert("대상을 찾을 수 없습니다.");
            return;
        }
        $("#edit_extracurricular_id").val(row.id || "");
        $("#edit_extracurricular_title").val(row.title || "");
        $("#edit_extracurricular_detail_url").val(row.detailUrl || "");
        $("#edit_extracurricular_summary").val(row.summary || "");
        $("#extracurricularEditModal").modal("show");
    }

    function save_extracurricular_admin(){
        if(!extracurricularAdminCanManage){
            alert("수정 권한이 없습니다.");
            return;
        }

        let id = to_number_or_null($("#edit_extracurricular_id").val());
        let title = ($("#edit_extracurricular_title").val() || "").trim();
        if(!title){
            alert("제목을 입력해주세요.");
            return;
        }

        let payload = {
            title: title,
            detailUrl: ($("#edit_extracurricular_detail_url").val() || "").trim(),
            summary: ($("#edit_extracurricular_summary").val() || "").trim()
        };

        let _data = new Map();
        if(id == null){
            _data.url = "/api/extracurricular_activities";
            _data.type = "POST";
            _data.param = payload;
        } else {
            payload.id = id;
            _data.url = "/api/extracurricular_activities";
            _data.type = "PUT";
            _data.param = payload;
        }
        _data.success = function(){
            $("#extracurricularEditModal").modal("hide");
            reload_extracurricular_admin();
        };
        _data.error = function(){
            alert("저장에 실패했습니다. 권한 또는 입력값을 확인해주세요.");
        };
        func_ajax(_data);
    }

    function delete_extracurricular_admin(id){
        if(!extracurricularAdminCanManage){
            alert("삭제 권한이 없습니다.");
            return;
        }
        if(!confirm("선택한 대외활동을 삭제하시겠습니까?")){
            return;
        }

        let _data = new Map();
        _data.url = "/api/extracurricular_activities";
        _data.type = "DELETE";
        _data.param = { id: id };
        _data.success = function(){
            reload_extracurricular_admin();
        };
        _data.error = function(){
            alert("삭제에 실패했습니다.");
        };
        func_ajax(_data);
    }

    function find_extracurricular_admin_row(id){
        for(let each of extracurricularAdminRows){
            if(each.id === id){
                return each;
            }
        }
        return null;
    }

    function to_number_or_null(value){
        if(value == null){
            return null;
        }
        let t = (value + "").trim();
        if(t === ""){
            return null;
        }
        let n = Number(t);
        if(!Number.isFinite(n)){
            return null;
        }
        return n;
    }

    function escape_html(value){
        return (value + "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/\"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    function escape_attr(value){
        return escape_html(value);
    }
</script>

</body>
</html>
