<!DOCTYPE html>
<html lang="en">

<th:block th:replace="~{includes/admin/head}" />

<body id="page-top">

<div id="wrapper">

    <th:block th:replace="~{includes/admin/sidebar}" />
    <script>
        $(".nav_extracurricular_activities_a").removeClass("collapsed");
        $(".nav_extracurricular_activities_div").addClass("show");
    </script>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <th:block th:replace="~{includes/admin/topbar}" />

            <div class="container-fluid">
                <h1 class="h3 mb-2 text-gray-800">대외활동 관리</h1>
                <p class="mb-4">대외활동 목록 조회, 등록, 수정, 삭제를 관리합니다.</p>

                <div class="mb-4">
                    <input type="hidden" id="input_extracurricular_keyword_changed" value="0" />
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">삭제여부</label>
                        <div class="col-sm-4">
                            <select class="select_search_extracurricular_keyword form-control mb-2" name="deleted" id="search_extracurricular_deleted" onchange="listener_extracurricular_keyword_changed()">
                                <option value="" selected="selected">전체</option>
                                <option value="false">일반</option>
                                <option value="true">삭제</option>
                            </select>
                        </div>
                        <label class="col-sm-6 col-form-label"></label>

                        <label class="col-sm-2 col-form-label">등록 시기</label>
                        <div class="col-sm-3">
                            <input class="form-control mb-2" id="search_extracurricular_sdate" type="date" onchange="listener_extracurricular_keyword_changed()"/>
                        </div>
                        <div class="col-sm-3">
                            <input class="form-control mb-2" id="search_extracurricular_fdate" type="date" onchange="listener_extracurricular_keyword_changed()"/>
                        </div>
                        <div class="col-sm-4">
                            <button class="btn btn-sm btn-outline-secondary" onclick="set_search_sdatefdate('null', 'extracurricular', listener_extracurricular_keyword_changed); return false;">초기화</button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="set_search_sdatefdate('today', 'extracurricular', listener_extracurricular_keyword_changed); return false;">오늘</button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="set_search_sdatefdate('week', 'extracurricular', listener_extracurricular_keyword_changed); return false;">1주</button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="set_search_sdatefdate('month', 'extracurricular', listener_extracurricular_keyword_changed); return false;">1개월</button>
                        </div>

                        <label class="col-sm-2 col-form-label">키워드</label>
                        <div class="col-sm-2">
                            <select class="form-control mb-2" id="search_extracurricular_keyword_field" onchange="set_extracurricular_keyword_field()">
                                <option value="10" selected="selected">제목</option>
                                <option value="20">요약</option>
                            </select>
                        </div>
                        <div class="col-sm-8">
                            <input id="search_extracurricular_keyword_title" onchange="listener_extracurricular_keyword_changed();"
                                   class="form-control search_extracurricular_keyword_each search_extracurricular_keyword_each_10 mb-2" type="text" placeholder="제목을 입력하세요"/>
                            <input id="search_extracurricular_keyword_summary" onchange="listener_extracurricular_keyword_changed();"
                                   class="form-control search_extracurricular_keyword_each search_extracurricular_keyword_each_20 mb-2 hide" type="text" placeholder="요약을 입력하세요"/>
                        </div>

                        <input type="hidden" id="cursor_extracurricular" />
                        <label class="col-sm-2 col-form-label">검색 기준</label>
                        <div class="col-sm-2">
                            <select class="form-control" id="search_extracurricular_orderby" onchange="listener_extracurricular_keyword_changed();">
                                <option value="id" selected="selected">등록순</option>
                            </select>
                        </div>
                        <label class="col-sm-2 col-form-label">한번에 불러올 갯수</label>
                        <div class="col-sm-2">
                            <select id="search_extracurricular_perpage" class="form-control" onchange="listener_extracurricular_keyword_changed();">
                                <option value="10">10</option>
                                <option value="50" selected="selected">50</option>
                                <option value="100">100</option>
                            </select>
                        </div>
                        <label class="col-sm-2 col-form-label">조회방향</label>
                        <div class="col-sm-2">
                            <select id="search_extracurricular_orderway" class="form-control" onchange="listener_extracurricular_keyword_changed();">
                                <option value="DESC" selected="selected">역방향</option>
                                <option value="ASC">정방향</option>
                            </select>
                        </div>

                        <label class="col-sm-10 col-form-label"></label>
                        <div class="col-sm-2 text-right">
                            <button class="btn btn-sm btn-outline-secondary" onclick="reset_extracurricular_search(); return false;">초기화</button>
                        </div>
                    </div>
                </div>

                <div class="w-100 mb-2">
                    <button id="btn_extracurricular_create" class="btn btn-primary" onclick="open_create_extracurricular_modal(); return false;">대외활동 등록</button>
                    <span id="extracurricular_readonly_msg" class="text-muted ml-2" style="display:none;">읽기 권한만 있습니다. 수정/삭제는 불가합니다.</span>
                    <span class="float-right">총 <span id="font_extracurricular_total_itemcount">-</span>개</span>
                </div>

                <div class="table-responsive">
                    <table class="table table-bordered bg-white">
                        <thead>
                        <tr>
                            <th style="width:70px;">ID</th>
                            <th style="width:90px;">삭제여부</th>
                            <th>제목</th>
                            <th>요약</th>
                            <th style="width:130px;">상세 URL</th>
                            <th style="width:220px;">입력일시/수정일시</th>
                            <th style="width:170px;">관리</th>
                        </tr>
                        </thead>
                        <tbody id="tbody_extracurricular_admin_list"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <th:block th:replace="~{includes/admin/footer}" />
    </div>
</div>

<div class="modal fade" id="extracurricularEditModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">대외활동 편집</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit_extracurricular_id" />
                <div class="form-group">
                    <label for="edit_extracurricular_title">제목</label>
                    <input id="edit_extracurricular_title" type="text" class="form-control" placeholder="제목을 입력하세요">
                </div>
                <div class="form-group">
                    <label for="edit_extracurricular_img">이미지 URL</label>
                    <input id="edit_extracurricular_img" type="text" class="form-control" placeholder="/image/... 또는 https://...">
                    <input type="file" class="form-control mt-2" id="extracurricular_img" accept="image/*" onchange="listenerSetImage(this, listener_upload_extracurricular_img)" />
                    <img class="hide mt-2" id="img_extracurricular_img" style="height: 75px;" alt="대외활동 이미지" />
                </div>
                <div class="form-group">
                    <label for="edit_extracurricular_detail_url">상세 URL</label>
                    <input id="edit_extracurricular_detail_url" type="text" class="form-control" placeholder="https://...">
                </div>
                <div class="form-group mb-0">
                    <label for="edit_extracurricular_summary">요약</label>
                    <textarea id="edit_extracurricular_summary" class="form-control" rows="4" placeholder="요약을 입력하세요"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">닫기</button>
                <button id="btn_extracurricular_save" type="button" class="btn btn-primary" onclick="save_extracurricular_admin();">저장</button>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{includes/admin/bottom}" />

<script>
    let extracurricularAdminRows = [];
    let extracurricularAdminCanManage = false;

    $(document).ready(function(){
        $("#search_extracurricular_keyword_title").on("keydown", function(e){
            if(e.key === "Enter"){
                listener_extracurricular_keyword_changed();
            }
        });
        $("#search_extracurricular_keyword_summary").on("keydown", function(e){
            if(e.key === "Enter"){
                listener_extracurricular_keyword_changed();
            }
        });
        $("#edit_extracurricular_img").on("input", function(){
            sync_extracurricular_img_preview_from_input();
        });
        set_extracurricular_keyword_field(false);
        resolve_extracurricular_manage_permission(function(){
            reload_extracurricular_admin();
        });
    });

    function resolve_extracurricular_manage_permission(callback){
        let _data = new Map();
        _data.url = "/api/permissiondetail/allow";
        _data.type = "POST";
        _data.param = {
            target: "extracurricular_activities",
            func: 120
        };
        _data.success = function(res){
            extracurricularAdminCanManage = !!(res && res.allowed === true);
            sync_extracurricular_manage_ui();
            if (callback) { callback(); }
        };
        _data.error = function(){
            extracurricularAdminCanManage = false;
            sync_extracurricular_manage_ui();
            if (callback) { callback(); }
        };
        func_ajax(_data);
    }

    function sync_extracurricular_manage_ui(){
        if(extracurricularAdminCanManage){
            $("#btn_extracurricular_create").show();
            $("#extracurricular_readonly_msg").hide();
            return;
        }
        $("#btn_extracurricular_create").hide();
        $("#extracurricular_readonly_msg").show();
    }

    function listener_extracurricular_keyword_changed(){
        $("#input_extracurricular_keyword_changed").val("1");
        reload_extracurricular_admin();
    }

    function set_extracurricular_keyword_field(shouldReload){
        let field = $("#search_extracurricular_keyword_field").val() || "10";
        $(".search_extracurricular_keyword_each").addClass("hide");
        $(".search_extracurricular_keyword_each_" + field).removeClass("hide");
        if(shouldReload !== false){
            listener_extracurricular_keyword_changed();
        }
    }

    function reset_extracurricular_search(){
        $("#search_extracurricular_deleted").val("");
        $("#search_extracurricular_sdate").val("");
        $("#search_extracurricular_fdate").val("");
        $("#search_extracurricular_keyword_field").val("10");
        $("#search_extracurricular_keyword_title").val("");
        $("#search_extracurricular_keyword_summary").val("");
        $("#search_extracurricular_orderby").val("id");
        $("#search_extracurricular_orderway").val("DESC");
        $("#search_extracurricular_perpage").val("50");
        set_extracurricular_keyword_field(false);
        reload_extracurricular_admin();
    }

    function reload_extracurricular_admin(){
        let keywordField = $("#search_extracurricular_keyword_field").val() || "10";
        let keyword = "";
        if(keywordField === "20"){
            keyword = $("#search_extracurricular_keyword_summary").val();
        } else {
            keyword = $("#search_extracurricular_keyword_title").val();
        }

        let _data = new Map();
        _data.url = "/api/extracurricular_activities/scrollList";
        _data.type = "GET";
        _data.param = {
            perpage: Number($("#search_extracurricular_perpage").val() || 50),
            orderby: $("#search_extracurricular_orderby").val() || "id",
            orderway: $("#search_extracurricular_orderway").val() || "DESC",
            cursor: null,
            sdate: $("#search_extracurricular_sdate").val(),
            fdate: $("#search_extracurricular_fdate").val(),
            deleted: listenerGetBooleanFromSelect("search_extracurricular_deleted"),
            keyword: keyword
        };
        _data.success = function(list){
            extracurricularAdminRows = list || [];
            render_extracurricular_admin_rows();
        };
        _data.error = function(){
            extracurricularAdminRows = [];
            $("#font_extracurricular_total_itemcount").text("0");
            alert("대외활동 목록을 불러오지 못했습니다.");
        };
        func_ajax(_data);
    }

    function render_extracurricular_admin_rows(){
        let tbody = $("#tbody_extracurricular_admin_list");
        tbody.html("");
        $("#font_extracurricular_total_itemcount").text(extracurricularAdminRows.length);

        if(extracurricularAdminRows.length === 0){
            tbody.append("<tr><td colspan='7' class='text-center text-muted'>등록된 대외활동이 없습니다.</td></tr>");
            return;
        }

        for(let row of extracurricularAdminRows){
            let id = row.id == null ? "-" : row.id;
            let deletedText = row.deleted === true ? "삭제" : "일반";
            let title = escape_html(row.title || "");
            let summary = escape_html(row.summary || "");
            let detailUrl = row.detailUrl || "";
            let detailMarkup = detailUrl
                ? ("<a href='" + escape_attr(detailUrl) + "' target='_blank' rel='noopener noreferrer'>열기</a>")
                : "-";
            let createdAt = format_datetime_display(row.createdAt);
            let modifiedAt = format_datetime_display(row.modifiedAt);
            let dateInfo = createdAt + " / " + modifiedAt;

            let actionMarkup = "<span class='text-muted'>조회 전용</span>";
            if(extracurricularAdminCanManage && row.id != null){
                actionMarkup = ""
                    + "<button class='btn btn-sm btn-outline-primary mr-1' onclick='open_edit_extracurricular_modal(" + row.id + "); return false;'>수정</button>"
                    + "<button class='btn btn-sm btn-outline-danger' onclick='delete_extracurricular_admin(" + row.id + "); return false;'>삭제</button>";
            }

            let tr = ""
                + "<tr>"
                + "<td>" + id + "</td>"
                + "<td>" + deletedText + "</td>"
                + "<td>" + title + "</td>"
                + "<td>" + summary + "</td>"
                + "<td>" + detailMarkup + "</td>"
                + "<td>" + dateInfo + "</td>"
                + "<td>" + actionMarkup + "</td>"
                + "</tr>";
            tbody.append(tr);
        }
    }

    function format_datetime_display(value){
        if(!value){
            return "-";
        }
        let text = (value + "").trim();
        if(!text){
            return "-";
        }
        if(text.length > 19){
            text = text.substring(0, 19);
        }
        return text.replace("T", " ");
    }

    function open_create_extracurricular_modal(){
        if(!extracurricularAdminCanManage){
            alert("수정 권한이 없습니다.");
            return;
        }
        $("#edit_extracurricular_id").val("");
        $("#edit_extracurricular_title").val("");
        $("#edit_extracurricular_img").val("");
        $("#extracurricular_img").val("");
        sync_extracurricular_img_preview("");
        $("#edit_extracurricular_detail_url").val("");
        $("#edit_extracurricular_summary").val("");
        $("#extracurricularEditModal").modal("show");
    }

    function open_edit_extracurricular_modal(id){
        if(!extracurricularAdminCanManage){
            alert("수정 권한이 없습니다.");
            return;
        }
        let row = find_extracurricular_admin_row(id);
        if(!row){
            alert("대상을 찾을 수 없습니다.");
            return;
        }
        $("#edit_extracurricular_id").val(row.id || "");
        $("#edit_extracurricular_title").val(row.title || "");
        $("#edit_extracurricular_img").val(row.img || "");
        $("#extracurricular_img").val("");
        sync_extracurricular_img_preview(row.img || "");
        $("#edit_extracurricular_detail_url").val(row.detailUrl || "");
        $("#edit_extracurricular_summary").val(row.summary || "");
        $("#extracurricularEditModal").modal("show");
    }

    function listener_upload_extracurricular_img(){
        let tempFile = null;
        let inputFile = document.getElementById("extracurricular_img");
        if (inputFile.files.length > 0) {
            tempFile = inputFile.files[0];
        }
        if (tempFile == null) {
            return;
        }

        let fileData = new FormData();
        fileData.append("file", tempFile);
        $.ajax({
            url: "/api/default/uploadFile",
            type: "POST",
            data: fileData,
            cache: false,
            contentType: false,
            processData: false,
            success: (data)=>{
                let imagePath = "/image/" + data;
                $("#edit_extracurricular_img").val(imagePath);
                sync_extracurricular_img_preview(imagePath);
            },
            error: ()=>{
                alert("이미지 업로드에 실패했습니다.");
            }
        });
    }

    function sync_extracurricular_img_preview_from_input(){
        sync_extracurricular_img_preview($("#edit_extracurricular_img").val());
    }

    function sync_extracurricular_img_preview(url){
        let value = (url || "").trim();
        let preview = $("#img_extracurricular_img");
        if(!value){
            preview.attr("src", "");
            preview.addClass("hide");
            return;
        }
        preview.attr("src", value);
        preview.removeClass("hide");
    }

    function save_extracurricular_admin(){
        if(!extracurricularAdminCanManage){
            alert("수정 권한이 없습니다.");
            return;
        }

        let id = to_number_or_null($("#edit_extracurricular_id").val());
        let title = ($("#edit_extracurricular_title").val() || "").trim();
        if(!title){
            alert("제목을 입력해주세요.");
            return;
        }

        let payload = {
            title: title,
            img: ($("#edit_extracurricular_img").val() || "").trim(),
            detailUrl: ($("#edit_extracurricular_detail_url").val() || "").trim(),
            summary: ($("#edit_extracurricular_summary").val() || "").trim()
        };

        let _data = new Map();
        if(id == null){
            _data.url = "/api/extracurricular_activities";
            _data.type = "POST";
            _data.param = payload;
        } else {
            payload.id = id;
            _data.url = "/api/extracurricular_activities";
            _data.type = "PUT";
            _data.param = payload;
        }
        _data.success = function(){
            $("#extracurricularEditModal").modal("hide");
            reload_extracurricular_admin();
        };
        _data.error = function(){
            alert("저장에 실패했습니다. 권한 또는 입력값을 확인해주세요.");
        };
        func_ajax(_data);
    }

    function delete_extracurricular_admin(id){
        if(!extracurricularAdminCanManage){
            alert("삭제 권한이 없습니다.");
            return;
        }
        if(!confirm("선택한 대외활동을 삭제하시겠습니까?")){
            return;
        }

        let _data = new Map();
        _data.url = "/api/extracurricular_activities";
        _data.type = "DELETE";
        _data.param = { id: id };
        _data.success = function(){
            reload_extracurricular_admin();
        };
        _data.error = function(){
            alert("삭제에 실패했습니다.");
        };
        func_ajax(_data);
    }

    function find_extracurricular_admin_row(id){
        for(let each of extracurricularAdminRows){
            if(each.id === id){
                return each;
            }
        }
        return null;
    }

    function to_number_or_null(value){
        if(value == null){
            return null;
        }
        let t = (value + "").trim();
        if(t === ""){
            return null;
        }
        let n = Number(t);
        if(!Number.isFinite(n)){
            return null;
        }
        return n;
    }

    function escape_html(value){
        return (value + "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/\"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    function escape_attr(value){
        return escape_html(value);
    }
</script>

</body>
</html>
